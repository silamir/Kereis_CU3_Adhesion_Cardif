paths:
  #
  # SUPERVISION
  #

  ############################################################
  "/private/open/health":
    ############################################################

    # GET /private/open/health
    get:
      tags:
        - Supervision
      summary: "Health check service"
      description: |
        This service returns a 200 status code if the instance does not need to be destroyed and replaced.

        This service returns a 503 status code otherwise.

        The health check is considered OK if the tomcat and database are up.
      security: []
      responses:
        "200":
          description: "Service is up"
        "503":
          description: "Service is down"

  ############################################################
  "/private/open/availability":
    ############################################################

    # GET /private/open/availability
    get:
      tags:
        - Supervision
      summary: "Availability check service"
      description: |
        This service returns a 200 status code if the application can guarantee a degraded mode.

        This service returns a 503 status code otherwise.

        The availability check is considered OK if the tomcat, the database and all required resources for a degraded mode are up (e.g. S3 bucket, piece-web-metier).
      security: []
      responses:
        "200":
          description: "Service is available"
          content:
            text/plain:
              schema:
                type: string
                example: "OK"
        "503":
          description: "Service is unavailable"
          content:
            text/plain:
              schema:
                type: string
                example: "KO"

  ############################################################
  "/private/open/supervision":
    ############################################################

    # GET /private/open/supervision
    get:
      tags:
        - Supervision
      summary: "Supervision check service"
      description: |
        TODO
      security: []
      responses:
        "200":
          description: "Service is up"
          content:
            text/html:
              schema:
                type: string
        "503":
          $ref: "#/components/responses/ServiceUnavailableResponse"

  #
  # AUTHENTIFICATION
  #

  ############################################################
  "/private/open/auth":
    ############################################################

    # POST /private/open/auth
    post:
      tags:
        - Authentication
      summary: "Validating application credentials and issuing a token for the client application"
      description: |
        * The Authorization header must be built like this: base64(clientId:clientSecret)
      security:
        - basicAuth: []
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderFeatureFlag"
        - $ref: "#/components/parameters/HeaderImpersonateApp"
      requestBody:
        $ref: "#/components/requestBodies/AuthenticationRequestBody"
      responses:
        "200":
          $ref: "#/components/responses/AuthenticationOKResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        default:
          $ref: "#/components/responses/UnexpectedErrorResponse"

    ############################################################
  "/private/open/refresh":
    ############################################################

    # POST /private/open/refresh
    post:
      tags:
        - Authentication
      summary: "Refreshing an access token"
      description: |
      security: []
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderImpersonateApp"
      requestBody:
        $ref: "#/components/requestBodies/RefreshRequestBody"
      responses:
        "200":
          $ref: "#/components/responses/RefreshOKResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        default:
          $ref: "#/components/responses/UnexpectedErrorResponse"

  #
  # QUARTZ JOB
  #

  ############################################################
  "/private/secure/jobs/execute/{jobGroup}/{jobName}":
    ############################################################

    # POST /private/secure/jobs/execute/{jobGroup}/{jobName}
    post:
      tags:
        - Quartz Jobs Manager Resources
      summary: "Execute specific job identified by its group and name"
      description: |
        * This is a technical service for internal use only. Execute specific job identified by its group and name stored in db. To find job identifiers
        * you can call list service below. Additionnal parameters can be provide to feed the jobDataMap
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/RequiredHeaderUserProfile"
        - $ref: "#/components/parameters/RequiredHeaderUserAgent"
        - $ref: "#/components/parameters/JobGroup"
        - $ref: "#/components/parameters/JobName"
        - $ref: "#/components/parameters/JobExecutionDelay"
      requestBody:
        $ref: "#/components/requestBodies/JobsCreationRequestBody"
      responses:
        "204":
          description: "Job successfully scheduled."
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        default:
          $ref: "#/components/responses/UnexpectedErrorResponse"

  ############################################################
  "/private/secure/jobs/list":
    ############################################################

    # GET /private/secure/jobs/list
    get:
      tags:
        - Quartz Jobs Manager Resources
      summary: "Get list of scheduled jobs"
      description: |
        * Get list of scheduled quartz jobs (i.e : jobs that are declared in quartz project configuration)
        * Paging:
          * The service takes three query parameters to handle paging:
            * limit: the maximum number of element to retrieve
            * offset: the index of the first element to be retrieved
            * totalCount: true if the total count of elements that can be retrieved shall be returned
          * The service returns a `_links` node with links to:
            * the `first` element
            * the `previous` element (if there is one)
            * the `next` element (if there is one)
          * The service returns a `totalCount` element if the associated query param is true.
            * the `last` element (if `totalCount = true` ; strongly discouraged for performance issue)
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderFeatureFlag"
        - $ref: "#/components/parameters/HeaderImpersonateApp"
        - $ref: "#/components/parameters/RequiredHeaderUserProfile"
        - $ref: "#/components/parameters/RequiredHeaderUserAgent"
        - $ref: "#/components/parameters/ContentRangeLimit"
        - $ref: "#/components/parameters/ContentRangeOffset"
        - $ref: "#/components/parameters/ContentRangeTotalCount"
      responses:
        "200":
          $ref: "#/components/responses/JobsListOKResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        default:
          $ref: "#/components/responses/UnexpectedErrorResponse"

  ############################################################
  "/private/secure/jobs/pause":
    ############################################################

    # POST /private/secure/jobs/pause
    post:
      tags:
        - Quartz Jobs Manager Resources
      summary: "Pause all scheduled jobs"
      description: |
        * Pause all scheduled jobs
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/RequiredHeaderUserProfile"
        - $ref: "#/components/parameters/RequiredHeaderUserAgent"
      responses:
        "204":
          description: All scheduled jobs are paused
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        default:
          $ref: "#/components/responses/UnexpectedErrorResponse"

  ############################################################
  "/private/secure/jobs/resume":
    ############################################################

    # POST /private/secure/jobs/resume
    post:
      tags:
        - Quartz Jobs Manager Resources
      summary: "Resume all scheduled jobs"
      description: |
        * Resume all scheduled jobs
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/RequiredHeaderUserProfile"
        - $ref: "#/components/parameters/RequiredHeaderUserAgent"
      responses:
        "204":
          description: All scheduled jobs are resumed
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        default:
          $ref: "#/components/responses/UnexpectedErrorResponse"

