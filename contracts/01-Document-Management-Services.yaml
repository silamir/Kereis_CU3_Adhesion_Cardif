  #
  # OUTPUT DOCUMENT - TRANSMISSION
  #

  ############################################################
  "/private/secure/output/transmissions":
    ############################################################

    # POST /private/secure/output/transmissions
    post:
      tags:
        - Output Document - Transmission
      summary: "Creating a transmission group"
      description: |
        * A transmission defines how output documents are transmitted to a recipient on a specific channel.
        * A transmission can include different documents from different creation groups.
        * A transmission can include several documents of a document group but not all.
        * A document can be part of multiple transmissions.
        * By default the service should not return any subresource. If you want to retrieve them, specify the `extension` query param (e.g. `extension=documents`).
        * By default, a transmission is not sent automatically until the `send` service is called.
        * However a `send` query parameter can be set to true at the creation to achieve the same result. A `delay` query parameter, in seconds, allow to specify a delay after which the transmission will be sent.
        * __v1:__
          * As output documents are still transmitted using 'Chaîne de transfert' or EDIIS webservices which relies on the legacy system, implementation in v1 is this:
            * For each document of a transmission, a fake document in the same group ('lot sortant') is created in the state `Lot en cours de création` in the legacy system referencing the same content.
            * When the transmission is sent, the fake documents states are set to `En attente`
            * The status of the fake documents is mapped to the delivery state of the transmission.
        * For the creation of an OUTPUT_EMAIL or OUTPUT_SMS transmission,
          * the first document of the transmission must have a txt or html content (json node `content.mimeType` being `text/plain` or `text/html`).
          * (email only) other documents of the transmission will be considered as attachments and should be application/pdf
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderFeatureFlag_Create"
        - $ref: "#/components/parameters/HeaderImpersonateApp"
        - $ref: "#/components/parameters/RequiredHeaderUserProfile"
        - $ref: "#/components/parameters/RequiredHeaderUserAgent"
        - $ref: "#/components/parameters/RequiredHeaderLanguage"
        - $ref: "#/components/parameters/TransmissionLock"
        - name: send
          in: query
          description: "If true, sends the transmission immediately or after a specified delay. If false, the delay parameter must not be specified."
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/DeliveryDelay"
      requestBody:
        $ref: "#/components/requestBodies/TransmissionCreationRequestBody"
      responses:
        "201":
          $ref: "#/components/responses/TransmissionCreationCreatedResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        default:
          $ref: "#/components/responses/UnexpectedErrorResponse"

    #GET /private/secure/output/transmissions
    get:
      tags:
        - Output Document - Transmission
      summary: "Listing transmissions and their associated output documents"
      description: |
        * By default the service should not return any subresource. If you want to retrieve them, specify the `extension` query param (e.g. `extension=documents`).
        * Paging:
          * The service takes three query parameters to handle paging:
            * limit: the maximum number of element to retrieve
            * offset: the index of the first element to be retrieved
            * totalCount: true if the total count of elements that can be retrieved shall be returned
          * The service returns a `_links` node with links to:
            * the `first` element
            * the `previous` element (if there is one)
            * the `next` element (if there is one)
          * The service returns a `totalCount` element if the associated query param is true.
            * the `last` element (if `totalCount = true` ; strongly discouraged for performance issue)
        * v1:
          * activity is required and must be unique (not an array)
          * domain is required
          * only one date is available with the query param modifiedAt
          * apiVersion is not supported
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderFeatureFlag_Read"
        - $ref: "#/components/parameters/HeaderImpersonateApp"
        - $ref: "#/components/parameters/RequiredHeaderUserProfile"
        - $ref: "#/components/parameters/RequiredHeaderUserAgent"
        - $ref: "#/components/parameters/RequiredHeaderLanguage"
        - $ref: "#/components/parameters/ContentRangeLimit"
        - $ref: "#/components/parameters/ContentRangeOffset"
        - $ref: "#/components/parameters/ContentRangeTotalCount"
        #- $ref: '#/components/parameters/ContentRangeOrder'
        - $ref: "#/components/parameters/OutputTransmissionExtensionList"
        - $ref: "#/components/parameters/TransmissionUuidList"
        - $ref: "#/components/parameters/ActivityIdList"
        - $ref: "#/components/parameters/DistributorInternalCodeList"
        - $ref: "#/components/parameters/DomainIdList"
        #- $ref: '#/components/parameters/FamilyIdList'
        #- $ref: '#/components/parameters/GroupId'
        - $ref: "#/components/parameters/DocumentUuidList"
        - $ref: "#/components/parameters/InsurerIdList"
        - $ref: "#/components/parameters/PlannedDeliveryFrom"
        - $ref: "#/components/parameters/PlannedDeliveryTo"
        - $ref: "#/components/parameters/CreatedFrom"
        - $ref: "#/components/parameters/CreatedTo"
        - $ref: "#/components/parameters/ModifiedFrom"
