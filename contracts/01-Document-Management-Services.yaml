      description: "Represents the reference of a case (aka the subscription, claim or postsales reference)."

    SenderAddress:
      description: "Sender address"
      type: object
      properties:
        line1:
          type: string
          description: 'For France: "Identification du destinataire (raison sociale ou dénomination commerciale pour un professionnel, civilité, titre ou qualité + prénom + nom pour un particulier)"'
        line2:
          type: string
          description: 'For France: "Identité du destinataire, service pour un professionnel ou complément d’identification du destinataire ou point de remise à l’intérieur du bâtiment : N° appartement, boite aux lettres, étage, couloir, escalier… pour un particulier"'
        line3:
          type: string
          description: 'For France: "Complément d’identification du point géographique à l’extérieur du bâtiment : entrée, bâtiment, immeuble, résidence, zone industrielle…"'
        line4:
          type: string
          description: 'For France: "Numéro, type et nom de la voie"'
        line5:
          type: string
          description: 'For France: "Mentions spéciales de distribution : boite postale, tri spécial arrivée… pour un professionnel ou Lieu-dit ou service particulier de distribution (ex : boite postale) pour un particulier"'
        line6:
          type: string
          description: 'For France: "Code postal + Nom de la ville (+ éventuellement le mot "CEDEX")"'
        line7:
          type: string
          description: 'For France: "Nom du pays (dans le cas d’un envoi à l’étranger)"'
        zipCode:
          type: string
          description: "Postal code"
        city:
          type: string
          description: "City"
        countryId:
          type: integer
          description: "Country code from the Kereis country referential"

