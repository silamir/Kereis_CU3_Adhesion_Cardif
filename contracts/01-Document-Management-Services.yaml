    put:
      tags:
        - Output Document - Datamatrix
      summary: "Affixing a datamatrix on an output document content"
      description: |
        * This service creates a new version of document content and affixes a datamatrix on it.
        * By default, the position of the datamatrix is (xRatio, yRatio) = (0.048, 0.946) and the default page is the first one.
        * Affixing a datamatrix on the document without content is not allowed.
        * Affixing two datamatrix on the same document is not allowed.
        * It's forbidden to affix a datamatrix on a document that belongs to a transmission.
        * __v1:__
          * No versioning is operated in v1
      requestBody:
        $ref: "#/components/requestBodies/OutputDocumentContentAffixRequestBody"
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderFeatureFlag_Update"
