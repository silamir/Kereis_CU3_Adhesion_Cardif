        - $ref: "#/components/parameters/KeepActive"
        - $ref: "#/components/parameters/KeepHasContent"
        - $ref: "#/components/parameters/KeepFirst"
        - $ref: "#/components/parameters/KeepLast"
      responses:
        "204":
          description: "Document versions have been pruned."
