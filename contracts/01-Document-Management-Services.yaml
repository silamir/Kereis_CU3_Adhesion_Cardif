  ############################################################
  "/private/secure/output/documents/{documentUuid}/clone":
    ############################################################

    # POST /private/secure/output/documents/{documentUuid}/clone
    post:
      tags:
        - Output Document - Core
      summary: "Cloning an output document"
      description: |
        * Creates an output document from an output document.
        * Each new created document (`source`) is associated to the original document (`target`) with a `CLONING` relationship.
        * A `DOCUMENT_CLONED_TO` event is triggered for the original document and a `DOCUMENT_CLONED_FROM` event is triggered for the clone.
        * If no `outputCreationGroupId` is specified, the created documentis created in a new creation group.
        * Supported mime types of original documents that can be cloned into a pdf: text/html, application/xhtml+xml, image/png, image/jpeg, text/plain, image/tiff
        * __v1:__
          * Cloning duplicates the 'pièce' in the legacy system duplicates its content.
          * targetMimeType is not supported
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderFeatureFlag_Create"
        - $ref: "#/components/parameters/HeaderImpersonateApp"
        - $ref: "#/components/parameters/RequiredHeaderUserProfile"
        - $ref: "#/components/parameters/RequiredHeaderUserAgent"
        - $ref: "#/components/parameters/RequiredHeaderLanguage"
        - $ref: "#/components/parameters/RequiredPathDocumentUuid"
        - name: outputCreationGroupId
          in: query
          description: "Output group creation UUID."
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/TargetMimeType"
      responses:
        "201":
          $ref: "#/components/responses/OutputDocumentCloneCreatedResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "409":
          $ref: "#/components/responses/ConflictResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        default:
          $ref: "#/components/responses/UnexpectedErrorResponse"

  ############################################################
  "/private/secure/output/documents/lock":
    ############################################################

    # POST /private/secure/output/documents/lock
    post:
      deprecated: true
      tags:
        - Output Document - Core
      summary: "Locking a list of output documents"
      description: |
        * This service locks a list of output documents.
        * The service takes a time out parameter set to 14400 seconds by default. After this duration, the document shall be unlock. This time out is a safety net so that a document doesn't get stuck in locked mode.
        * A `DOCUMENT_LOCKED` event is triggered as the document is locked.
        * __v1:__
          * No time out handled.
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderFeatureFlag_Update"
        - $ref: "#/components/parameters/HeaderImpersonateApp"
        - $ref: "#/components/parameters/RequiredHeaderUserProfile"
        - $ref: "#/components/parameters/RequiredHeaderUserAgent"
        - $ref: "#/components/parameters/RequiredHeaderLanguage"
        - $ref: "#/components/parameters/RequiredDocumentUuidList"
        - $ref: "#/components/parameters/TimeOut"
      responses:
        "204":
          description: "Document has been locked."
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "409":
          $ref: "#/components/responses/ConflictResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        default:
          $ref: "#/components/responses/UnexpectedErrorResponse"

