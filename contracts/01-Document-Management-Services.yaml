          description: "Reception type identifier."
          type: string
          enum:
            [
              "INPUT_BACK_OFFICE",
              "INPUT_CONTACT_CENTER",
              "INPUT_EDI",
              "INPUT_EMAIL",
              "INPUT_FAX",
              "INPUT_MAIL",
              "INPUT_CUSTOMER_UPLOAD",
              "INPUT_SALES_TOOL",
            ]

    InputBackOfficeProperties:
      type: object
      description: "Specific Back Office properties."

    InputContactCenterProperties:
      type: object
      description: "Specific Contact Center properties."

    InputEdiProperties:
