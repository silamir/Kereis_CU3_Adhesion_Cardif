        - $ref: "#/components/schemas/InputMailProperties"

    InputCustomerUploadReceptionTypeCreateBody:
      type: object
      allOf:
        - $ref: "#/components/schemas/ReceptionTypeId"
        - $ref: "#/components/schemas/InputCustomerUploadProperties"

    Reception:
