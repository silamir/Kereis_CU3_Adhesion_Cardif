    post:
      deprecated: true
      tags:
        - Input Document - Versioning
      summary: "Pruning the versions of the document"
      description: |
        * Prunes the versions of the document according to the pruning parameters:
          * keepArchivable: keeps the archivable version
          * keepActive: keeps all the actives versions
          * keepHasContent: keeps all the versions with content
          * keepLast: keeps the last active version version with content
          * keepFirst: keeps the first active version with content
