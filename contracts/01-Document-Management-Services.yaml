          type: integer
          format: int32

    ArchivingStateId:
      type: object
      description: "Archiving state of the document."
      properties:
        id:
          type: string
          description: "Archiving state identifier."
          enum: ["CURRENT", "DECLARED", "RESTRICTED", "DESTROYED"]

    ArchivingState:
      type: object
      description: "Archiving state of the document."
      allOf:
        - $ref: "#/components/schemas/ArchivingStateId"
      properties:
        name:
          type: string
          description: "Archiving state name."

    ArchivingContextId:
      type: object
      properties:
        id:
          type: integer
          format: int32

    ArchivingContext:
      type: object
      allOf:
        - $ref: "#/components/schemas/ArchivingContextId"
      properties:
        name:
          type: string

    ArchivingRequest:
      type: object
      properties:
        context:
          $ref: "#/components/schemas/ArchivingContext"
        description:
          type: string
        reference:
          type: string
        requestedAt:
          $ref: "#/components/schemas/DateTime"
        requestedByApp:
          $ref: "#/components/schemas/App"
        requestedByUser:
          $ref: "#/components/schemas/User"
        processedAt:
          $ref: "#/components/schemas/DateTime"
        processedByApp:
          $ref: "#/components/schemas/App"
        processedByUser:
          $ref: "#/components/schemas/User"
