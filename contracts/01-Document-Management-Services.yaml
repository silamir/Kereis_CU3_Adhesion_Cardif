          type: string
          description: "Recipient address of the email."
        sender:
          type: string
          description: "Sender addresse of the email."

    InputFaxProperties:
      type: object
      description: "Specific fax properties."
      properties:
        called:
          type: string
          description: "Called number of the fax."
        calling:
          type: string
          description: "Calling number of the fax."
        externalReference:
          type: string
          description: "External reference of the fax system (currently Topcall)."

    InputMailProperties:
      type: object
