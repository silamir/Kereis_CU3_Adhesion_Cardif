  # Reusable path, query, header and cookie parameters
  parameters:
    # Common Parameters
    #   Header
    HeaderClientRequestId:
      name: Client-Request-Id
      in: header
      description: "Client request id"
      schema:
        type: string

    RequiredHeaderLanguage:
      name: Accept-Language
      in: header
      description: "Language"
      required: false
      schema:
        type: string
        enum: [ca, de, de_AT, en, es, fr, it, pl]
        default: "fr"

    RequiredHeaderUserProfile:
      name: User-Profile
      in: header
      description: "User profile"
      required: true
      schema:
        type: string

    RequiredHeaderUserAgent:
      name: User-Agent
      in: header
      description: "User Agent of the client application, shall be <application name>/<application version> (e.g. PostmanRuntime/7.20.1)"
      required: true
      schema:
        type: string
        pattern: '\w+\/\d+(\.\d+)*'

    HeaderFeatureFlag:
      name: X-Features
      in: header
      description: "Feature Flag"
      schema:
        type: array
        items:
          type: string
          enum:
            [
              V1,
              V2_READ,
              V2_UPDATE,
              V2_CREATE,
              USER_AUTHORITIES,
              LOCAL_TIME,
              ZONED_TIME,
            ]

    HeaderFeatureFlag_Read:
      name: X-Features
      in: header
      description: "Feature Flag"
      schema:
        type: array
        items:
          type: string
          enum:
            [
              V1,
              V2_READ,
              USER_AUTHORITIES,
              LOCAL_TIME,
              ZONED_TIME,
              OLD_PROCESSING_STATES,
            ]

    HeaderFeatureFlag_Update:
      name: X-Features
      in: header
      description: "Feature Flag"
      schema:
        type: array
        items:
          type: string
          enum: [V1, V2_UPDATE, USER_AUTHORITIES, LOCAL_TIME, ZONED_TIME]

    HeaderFeatureFlag_Create:
      name: X-Features
      in: header
      description: "Feature Flag"
      schema:
        type: array
        items:
          type: string
          enum: [V1, V2_CREATE, USER_AUTHORITIES, LOCAL_TIME, ZONED_TIME]

    HeaderImpersonateApp:
      name: Impersonate-App
      in: header
      description: "Name of application to impersonate (like dms_oav, dms_inocs, etc)"
      schema:
        type: string

    #   Path

    #   Query
    ContentRangeLimit:
      name: limit
      in: query
      schema:
        type: integer
        format: int32
        default: 20

    ContentRangeOffset:
      name: offset
      in: query
      schema:
        type: integer
        format: int32
        default: 0

    ContentRangeTotalCount:
      name: totalCount
      in: query
      schema:
        type: boolean
        default: false

    ExtensionList:
      name: extension
      in: query
      schema:
        type: array
        items:
          type: string

    CaseExtensionList:
      name: extension
      in: query
      schema:
        type: array
        items:
          type: string
          enum: [reception]

    InputDocumentExtensionList:
      name: extension
      in: query
      schema:
        type: array
        items:
          type: string
          enum:
            [
              reception,
              archiving_requests,
              associations,
              transfers,
              events,
              content,
            ]

    InputReceptionExtensionList:
      name: extension
      in: query
      schema:
        type: array
        items:
          type: string
          enum: [documents]

    InputDocumentUrgencyList:
      name: priority
      in: query
      schema:
        type: array
        items:
          type: string
          enum: [URGENT, NON_URGENT, NO_SLA, OVERDUE]

    OutputDocumentExtensionList:
      name: extension
      in: query
      schema:
        type: array
        items:
          type: string
          enum:
            [
              transmissions,
              archiving_requests,
              associations,
              transfers,
              template,
              content,
              events,
              creation_group,
            ]

    OutputCreationGroupExtensionList:
      name: extension
      in: query
