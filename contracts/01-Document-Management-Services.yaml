          enum:
            [
              "READY",
              "PENDING_INDEXATION",
              "PENDING_PROCESSING",
              "BOUND",
              "MANIPULATED",
              "ARCHIVED",
              "PROCESSED",
              "DISCARDED",
              "REJECTED",
            ]

    InputDocumentProcessingState:
      type: object
      description: "Processing state of an input document."
      allOf:
        - $ref: "#/components/schemas/InputDocumentProcessingStateId"
      properties:
        name:
          type: string
          description: "Processing state name."

    InputDocument:
      type: object
      allOf:
        - $ref: "#/components/schemas/CoreDocument"
      properties:
        binding:
          $ref: "#/components/schemas/NullableDocumentBinding"
        indexation:
          $ref: "#/components/schemas/InputIndexationProperties"
        permissions:
          $ref: "#/components/schemas/InputPermissionsProperties"
        processingState:
          $ref: "#/components/schemas/InputDocumentProcessingState"
        sla:
          $ref: "#/components/schemas/NullableSlaProperties"
        version:
          type: string
          description: "API version of the document"

    Case:
      type: object
      allOf:
        - $ref: "#/components/schemas/CreationAudit"
        - $ref: "#/components/schemas/ModificationAudit"
