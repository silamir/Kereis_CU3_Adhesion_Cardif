  ############################################################
  "/private/secure/input/documents/{documentUuid}/clone":
    ############################################################

    # POST /private/secure/input/documents/{documentUuid}/clone
    post:
      tags:
        - Input Document - Core
      summary: "Cloning an input document"
      description: |
        * This service creates an input or output document from an input document.
        * The target type of document is given by the parameter `targetDocumentType`.
        * By default, creates a document of the same document type.
        * The new created document (`target`) is associated to the original document (`source`) with a `CLONING` relationship.
        * A `DOCUMENT_CLONED_TO` event is triggered for the original document and a `DOCUMENT_CLONED_FROM` event is triggered for the clone.
        * If an input document is cloned to an output document, a creation group UUID must be specified.
        * An input document cloned from another input document is created in the same reception group.
        * An input document cloned from another input document is created with the same processing state, unless a `targetProcessingState` is specified.
        * Supported mime types of original documents that can be cloned into a pdf: text/html, application/xhtml+xml, image/png, image/jpeg, text/plain, image/tiff  
        * __v1:__
          * Cloning duplicates the 'pièce' in the legacy system duplicates its content.
          * Cloning a document in the `READY` processing state creates a new document in the `PENDING_PROCESSING` processing state and not `READY` processing state.
          * targetMimeType is not supported
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderFeatureFlag_Create"
        - $ref: "#/components/parameters/HeaderImpersonateApp"
        - $ref: "#/components/parameters/RequiredHeaderUserProfile"
        - $ref: "#/components/parameters/RequiredHeaderUserAgent"
        - $ref: "#/components/parameters/RequiredHeaderLanguage"
        - $ref: "#/components/parameters/RequiredPathDocumentUuid"
        - $ref: "#/components/parameters/RequiredTargetDocumentType"
        - $ref: "#/components/parameters/Lock"
        - $ref: "#/components/parameters/TimeOut"
        - $ref: "#/components/parameters/TargetProcessingState"
        - name: outputCreationGroupId
          in: query
          description: "Output creation group UUID."
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/TargetMimeType"
      responses:
        "201":
          $ref: "#/components/responses/InputDocumentCloneCreatedResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        "501":
          $ref: "#/components/responses/NotImplementedResponse"
        default:
          $ref: "#/components/responses/UnexpectedErrorResponse"

  ############################################################
  "/private/secure/input/documents/lock":
    ############################################################

    # POST /private/secure/input/documents/lock
    post:
      tags:
        - Input Document - Core
      summary: "Locking a list of input documents"
      description: |
        * This service locks a list of input documents.
        * The service takes a time out parameter set to 3600 seconds by default. After this duration, the document shall be unlock. This time out is a safety net so that a document doesn't get stuck in locked mode.
        * A `DOCUMENT_LOCKED` event is triggered as a document is locked.
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderFeatureFlag_Update"
        - $ref: "#/components/parameters/HeaderImpersonateApp"
        - $ref: "#/components/parameters/RequiredHeaderUserProfile"
        - $ref: "#/components/parameters/RequiredHeaderUserAgent"
        - $ref: "#/components/parameters/RequiredHeaderLanguage"
        - $ref: "#/components/parameters/RequiredDocumentUuidList"
        - $ref: "#/components/parameters/TimeOut"
        - name: force
          in: query
          description: "If false, locking will fail upfront if one of the documents can't be locked. If true, all lockable documents will get locked, the list of locked documents will be returned (no error)."
          schema:
            type: boolean
            default: false
      responses:
        "200":
          $ref: "#/components/responses/InputDocumentListOKResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "409":
          $ref: "#/components/responses/ConflictResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        default:
          $ref: "#/components/responses/UnexpectedErrorResponse"

  ############################################################
  "/private/secure/input/documents/lock/next":
    ############################################################

    # POST /private/secure/input/documents/lock/next
    post:
      tags:
        - Input Document - Core
      summary: "Automatically lock the next documents matching the search criteria"
      description: |
        * This service automatically locks the next documents matching the search criteria and returns the list.
        * Use lockMode=RECEPTION_GROUP_AND_REFERENCE to add documents which share the same reference as the first document in the reception.
        * Use lockMode=RECEPTION_GROUP_AND_REFERENCE_AND_INSURED to add documents which share the same reference and insured first name and last name as the first document in the reception.
        * The service takes a time out parameter set to 3600 seconds by default. After this duration, the document shall be unlock. This time out is a safety net so that a document doesn't get stuck in locked mode.
        * A `DOCUMENT_LOCKED` event is triggered as a document is locked.
        * This service only works with V2_UPDATE
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderFeatureFlag_Update"
        - $ref: "#/components/parameters/HeaderImpersonateApp"
        - $ref: "#/components/parameters/RequiredHeaderUserProfile"
        - $ref: "#/components/parameters/RequiredHeaderUserAgent"
        - $ref: "#/components/parameters/RequiredHeaderLanguage"
        - $ref: "#/components/parameters/ContentRangeLimit"
        - $ref: "#/components/parameters/ContentRangeOffset"
        - $ref: "#/components/parameters/ContentRangeTotalCount"
        - $ref: "#/components/parameters/InputDocumentUrgencyList"
        - $ref: "#/components/parameters/SortByFieldList"
        - $ref: "#/components/parameters/CreatedFrom"
        - $ref: "#/components/parameters/CreatedTo"
        - $ref: "#/components/parameters/ActivityIdList"
        - $ref: "#/components/parameters/DistributorIdList"
        - $ref: "#/components/parameters/DistributorInternalCodeList"
        - $ref: "#/components/parameters/DistributorGroupIdList"
        - $ref: "#/components/parameters/DocumentUuidList"
        - $ref: "#/components/parameters/DomainIdList"
        - $ref: "#/components/parameters/FamilyIdList"
        - $ref: "#/components/parameters/WithoutFamily"
        - $ref: "#/components/parameters/GroupIdList"
        - $ref: "#/components/parameters/WithoutGroup"
        - $ref: "#/components/parameters/InsurerIdList"
        - $ref: "#/components/parameters/NatureIdList"
        - $ref: "#/components/parameters/WarrantyIdList"
        - $ref: "#/components/parameters/OperationalPerimeterId"
        - $ref: "#/components/parameters/FamilyGroupIdList"
        - $ref: "#/components/parameters/ModifiedFrom"
        - $ref: "#/components/parameters/ModifiedTo"
        - $ref: "#/components/parameters/ModifiedByUserUuid"
        - $ref: "#/components/parameters/RequiredProcessingStateNotClosedId"
        - $ref: "#/components/parameters/ReceptionTypeIdList"
        - $ref: "#/components/parameters/ReceptionUuidList"
        - $ref: "#/components/parameters/ScanningTypeIdList"
        - $ref: "#/components/parameters/Reference"
        - $ref: "#/components/parameters/WithoutReference"
        - $ref: "#/components/parameters/SubsidiaryId"
        - $ref: "#/components/parameters/Description"
        - $ref: "#/components/parameters/InsuredFirstName"
        - $ref: "#/components/parameters/InsuredLastName"
        - $ref: "#/components/parameters/ReceptionSender"
        - $ref: "#/components/parameters/ReceptionRecipient"
        - $ref: "#/components/parameters/ReceptionDateFrom"
        - $ref: "#/components/parameters/ReceptionDateTo"
        - $ref: "#/components/parameters/DeadlineDateFrom"
        - $ref: "#/components/parameters/DeadlineDateTo"
        - $ref: "#/components/parameters/LockedByUserUuid"
        - $ref: "#/components/parameters/Locked"
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/TimeOut"
        - $ref: "#/components/parameters/RequiredLockModeEnum"
      responses:
        "200":
          $ref: "#/components/responses/InputDocumentListOKResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "409":
          $ref: "#/components/responses/ConflictResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        default:
          $ref: "#/components/responses/UnexpectedErrorResponse"

  ############################################################
  "/private/secure/input/documents/unlock":
    ############################################################

    # POST /private/secure/input/documents/unlock
    post:
