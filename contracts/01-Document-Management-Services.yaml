        context:
          type: object
          properties:
            id:
              type: integer
              format: int32
        description:
          type: string

    InputDocumentDestroyBody:
      type: object
      required:
        - context
        - description
      properties:
        context:
          type: object
          properties:
            id:
              type: integer
              format: int32
        description:
          type: string

