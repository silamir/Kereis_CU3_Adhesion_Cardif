  #
  # INPUT DOCUMENT - CORE
  #
  ############################################################
  "/private/secure/input/documents":
    ############################################################

    # POST /private/secure/input/documents
    post:
      tags:
        - Input Document - Core
      summary: "Creating an input document"
      description: |
        * Create an input document with its metadata in the archive status `CURRENT`.
        * The service returns an upload URL in the response body.
        * The content has to be uploaded in a second time using this upload URL.
        * Once the content is uploaded, it will go through a series of processes (antivirus, document conversion, document recognition, text extraction, etc.)
        * The initial state of the document can be `PENDING_INDEXATION`, `PENDING_PROCESSING` or `READY`.
        * The processing lifecycle of an input document ends with the states `BOUND`, `MANIPULATED`, `ARCHIVED` or `PROCESSED`.
        * In order to create an input document within an existing reception group, one needs to specify the reception parameter with the reception UUID of a input document already in this group. Otherwise, the reception information shall be specified
        * The MIME type accepted is subject to a whitelist.
        * A `DOCUMENT_CREATED` event is triggered as the document is created.
        * User can add a dictionnary of metadata as they created a document. This dictionnary must be a compliant JSON schema and is limited to (TODO) ko.
        *
        * __v1:__
          * The description field in body request must be present
          * The document is created in Pièces, hence also returning a `legacyId` (aka code pièce).
          * User defined dictionnary of metadata is not available
          * Legacy means legacy. Don't get use to it!
          * In v1, reception grouping is equivalent to the legacy 'lot entrant', therefore when adding an input document to an existing 'lot entrant', you must specify the reception UUID (which will be a legacyId in v1) of the first input document.
          * A document can't be created in the `PROCESSED` state because its associated pièce will be Archived, and Archived pièce are considered as Declared and cannot be modified (no content upload is possible)
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderFeatureFlag_Create"
        - $ref: "#/components/parameters/HeaderImpersonateApp"
        - $ref: "#/components/parameters/RequiredHeaderUserProfile"
        - $ref: "#/components/parameters/RequiredHeaderUserAgent"
        - $ref: "#/components/parameters/RequiredHeaderLanguage"
        - $ref: "#/components/parameters/Lock"
        - $ref: "#/components/parameters/TimeOut"
        - $ref: "#/components/parameters/ComputeGroup"
        - $ref: "#/components/parameters/ComputeCaseIndexation"

      requestBody:
        $ref: "#/components/requestBodies/InputDocumentCreationRequestBody"
      responses:
        "201":
          $ref: "#/components/responses/InputDocumentCreationCreatedResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        default:
          $ref: "#/components/responses/UnexpectedErrorResponse"

    # GET /private/secure/input/documents
    get:
      tags:
        - Input Document - Core
      summary: "Listing input documents"
      description: |
        * Gets the list of input documents that match filters. Documents without an active content or with an archiving state = DESTROYED are never returned.
        * By default the service should not return any subresource. If you want to retrieve them, specify the `extension` query param (e.g. `extension=reception`).
        * Paging:
          * The service takes three query parameters to handle paging:
            * limit: the maximum number of element to retrieve
            * offset: the index of the first element to be retrieved
            * totalCount: true if the total count of elements that can be retrieved shall be returned
          * The service returns a `_links` node with links to:
            * the `first` element
            * the `previous` element (if there is one)
            * the `next` element (if there is one)
          * The service returns a `totalCount` element if the associated query param is true.
            * the `last` element (if `totalCount = true` ; strongly discouraged for performance issue)
        * Sorting:
          * The service is only available in v2
          * One parameter per row needs to be entered with the following format :
            `parameterName asc` : to sort by ascending order
            `parameterName desc` : to sort by descending order
          * Here is the mapping between the sort parameter names and the fields in the database

            | Parameter name         | Database schema              | Database table    | Database field                |
            | ---------------------- | ---------------------------- | ----------------- | ----------------------------- |
            | createdAt              | document_management_services |  input_document   | created_at                    |
            | reference              | document_management_services |  input_document   | indexation_reference          |
            | modifiedAt             | document_management_services |  input_document   | modified_at                   |
            | insuredFirstName       | document_management_services |  input_document   | indexation_insured_firstname  |
            | insuredLastName        | document_management_services |  input_document   | indexation_insured_lastname   |
            | modifiedByUserUuid     | document_management_services |  input_document   | modified_by_user_profile      |
            | receptionUuid          | document_management_services |  input_document   | reception_id                  |
            | description            | document_management_services |  input_document   | description                   |
            | receptionSender        | document_management_services |  reception        | sender                        |
            | receptionRecipient     | document_management_services |  reception        | recipient                     |
            | deadlineDate           | document_management_services |  input_document   | sla_properties_deadline_date  |
            | receptionOrder         | document_management_services |  input_document   | reception_order               |
            | receptionDate          | document_management_services |  reception        | received_at                   |
            | slaPriority            | document_management_services |  input_document   | sla_properties_deadline_date  |
            |                        |                              |                   | sla_properties_urgency_date   |
            | archiveReference       | document_management_services |  reception        | archive_reference             |
            | medicalConfidentiality | document_management_services |  input_document   | medical_confidentiality       |
            | pageCount              | document_management_services |  document_content | archive_reference             |
            | boundAt                | document_management_services |  input_document   | bound_at                      |
            | boundByUserUuid        | document_management_services |  input_document   | bound_by_user                 |

            The following parameters are translated labels in the 'message' column of the 'document_management_services_referential.message_bundle' table.
            The ids of the translations are stored in the following columns:

            | Parameter name    |  id value column                                                          |
            | ----------------- | ------------------------------------------------------------------------- |
            | activityId        | document_management_services.input_document.indexation_activity_id        |
            | domainId          | document_management_services.input_document.indexation_domain_id          |
            | insurerId         | document_management_services.input_document.indexation_insurer_id         |
            | distributorId     | document_management_services.input_document.indexation_distributor_id     |
            | natureId          | document_management_services.input_document.indexation_nature_id          |
            | subsidiaryId      | document_management_services.input_document.indexation_subsidiary_id      |
            | processingStateId | document_management_services.input_document.processing_state              |
            | receptionTypeId   | document_management_services.reception.reception_type                     |
            | groupId           | document_management_services.input_document.indexation_group_id           |
            | familyId          | document_management_services.input_document.indexation_family_id          |
            | warrantyId        | document_management_services.input_document.indexation_warranty_id        |
            | coverId           | document_management_services.input_document.indexation_cover_id           |

        * __v1:__
          * Some filters are not available in v1 because non existent in the legacy services:
            * `createdAt`
            * `createdByUserUuid`
            * `modifiedAt`
            * `warranty`
          * Some filters are not available in v1:
            * `createdFrom` and `createdTo`
            * `modifiedFrom` and `modifiedTo`
            * `apiVersion`
            * `distributorId`
            * `activityId` can't be a list
            * `familyId` can't be a list
            * `withoutFamily`
            * `groupId` can't be a list
            * `withoutGroup`
            * `receptionUuid`
            * `receptionSender`
            * `receptionRecipient`
            * `receptionDateFrom` and `receptionDateTo`
            * `boundDateFrom` and `boundDateTo`
            * `boundByUserUuid`
            * `operationalPerimeterId`
            * `familyGroupId`
            * `processingStateId` for the DMS status MANIPULATED and ARCHIVED, which are assimilated PROCESSED in DMS for the legacy status 7 - Archive            
         * Here is the mapping between processingStateId/lockedByUserUuid and the legacy state:

           | processingState    | lockedByUserUuid | legacyStateId         |
           | ------------------ | ---------------- | --------------------- |
           | PENDING_INDEXATION | not specified    | 12 and 13             |
           | PENDING_PROCESSING | not specified    | 3 and 4               |
           | BOUND              | not specified    | 6                     |
           | MANIPULATED        | not specified    | 7                     |
           | ARCHIVED           | not specified    | 7                     |
           | PROCESSED          | not specified    | 7                     |
           | PENDING_INDEXATION | specified        | 13                    |
           | PENDING_PROCESSING | specified        | 4                     |
           | BOUND              | specified        | no documents returned |
           | MANIPULATED        | specified        | no documents returned |
           | ARCHIVED           | specified        | no documents returned |
           | PROCESSED          | specified        | no documents returned |
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderFeatureFlag_Read"
        - $ref: "#/components/parameters/HeaderImpersonateApp"
        - $ref: "#/components/parameters/RequiredHeaderUserProfile"
        - $ref: "#/components/parameters/RequiredHeaderUserAgent"
        - $ref: "#/components/parameters/RequiredHeaderLanguage"
        - $ref: "#/components/parameters/ContentRangeLimit"
        - $ref: "#/components/parameters/ContentRangeOffset"
        - $ref: "#/components/parameters/ContentRangeTotalCount"
        - $ref: "#/components/parameters/InputDocumentUrgencyList"
        #- $ref: '#/components/parameters/ContentRangeOrder'
        - $ref: "#/components/parameters/SortByFieldList"
        - $ref: "#/components/parameters/InputDocumentExtensionList"
        - $ref: "#/components/parameters/CreatedFrom"
        - $ref: "#/components/parameters/CreatedTo"
        #- $ref: '#/components/parameters/CreatedByUserUuid'
        - $ref: "#/components/parameters/ActivityIdList"
        - $ref: "#/components/parameters/DistributorIdList"
        - $ref: "#/components/parameters/DistributorInternalCodeList"
        - $ref: "#/components/parameters/DistributorGroupIdList"
        - $ref: "#/components/parameters/DocumentUuidList"
