  ############################################################
  "/private/secure/referentials/families/last/parquet":
    ############################################################

    # GET /private/secure/referentials/families/last/parquet
    get:
      tags:
        - Referential - BI Export
      summary: "Export last parquet of families referential"
      description: |
        * Get the parquet file of families referential
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderFeatureFlag"
        - $ref: "#/components/parameters/HeaderImpersonateApp"
        - $ref: "#/components/parameters/RequiredHeaderUserProfile"
        - $ref: "#/components/parameters/RequiredHeaderUserAgent"
        - $ref: "#/components/parameters/RequiredHeaderLanguage"
        - $ref: "#/components/parameters/ExportDate"
      responses:
        "200":
          $ref: "#/components/responses/ExportParquetOKResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
