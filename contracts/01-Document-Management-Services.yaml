              "OUTPUT_MAIL_AND_FAX",
              "OUTPUT_WEBSITE",
            ]

    RequiredPathTransmissionUuid:
      name: transmissionUuid
      in: path
      description: "Transmission UUID"
      required: true
      schema:
        type: string
        format: uuid

    TransmissionUuidList:
      name: transmissionUuid
      in: query
      description: "Transmission UUID."
      schema:
        type: array
        items:
          type: string
          pattern: '[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}'

    TransmissionLock:
      name: lock
      in: query
      schema:
        type: boolean
        default: false

    #   Query
    DeliveryDelay:
      name: delay
      in: query
      description: "Delivery delay (in seconds)"
      schema:
        type: integer
        format: int32

    # Jobs
    JobGroup:
      name: jobGroup
      in: path
      required: true
      description: "Job group (example: dms)"
      schema:
        type: string

    JobName:
      name: jobName
      in: path
      required: true
      description: "Name of the job (example: refreshArchivingContextsJob)"
      schema:
        type: string

    JobExecutionDelay:
      name: delay
      in: query
      description: "Delay in seconds before executing the job (0 is now)"
      schema:
        type: integer
        format: int32
        default: 0

    Locale:
      name: locale
      in: path
      description: "Locale to get/update/patch"
      required: true
      schema:
        type: string
        enum: [ROOT, ca, de, en, es, fr, it, pl]
        default: ROOT

