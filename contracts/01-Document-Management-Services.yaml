        #  $ref: '#/components/schemas/DatamatrixId'
        indexation:
          $ref: "#/components/schemas/InputIndexationPropertiesCreateBody"
        permissions:
          $ref: "#/components/schemas/InputPermissionsPropertiesCreateBody"
        processingState:
          $ref: "#/components/schemas/InputDocumentProcessingStateId"
        metadata:
          type: object
        reception:
          oneOf:
            - $ref: "#/components/schemas/ReceptionId"
            - type: object
              required:
                - type
              properties:
                receivedAt:
                  type: string
                  format: date-time
                type:
                  anyOf:
                    - $ref: "#/components/schemas/InputBackOfficeReceptionTypeCreateBody"
                    - $ref: "#/components/schemas/InputContactCenterReceptionTypeCreateBody"
                    - $ref: "#/components/schemas/InputEdiReceptionTypeCreateBody"
                    - $ref: "#/components/schemas/InputEmailReceptionTypeCreateBody"
                    - $ref: "#/components/schemas/InputFaxReceptionTypeCreateBody"
                    - $ref: "#/components/schemas/InputMailReceptionTypeCreateBody"
                    - $ref: "#/components/schemas/InputCustomerUploadReceptionTypeCreateBody"

    InputDocumentUpdateBody:
      type: object
      allOf:
        - $ref: "#/components/schemas/CoreDocumentUpdateBody"
      properties:
        #datamatrix:
        #  $ref: '#/components/schemas/DatamatrixId'
        indexation:
          $ref: "#/components/schemas/InputIndexationPropertiesUpdateBody"
        permissions:
          $ref: "#/components/schemas/InputPermissionsPropertiesUpdateBody"
        processingState:
          $ref: "#/components/schemas/InputDocumentProcessingStateId"
        metadata:
          type: object

    InputDocumentContentUpdateBody:
      $ref: "#/components/schemas/DocumentContentUpdateBody"

