              enum: ["TESSI", "ARKHINEO"]
            name:
              type: string
              description: "Archiving solution provider name."
        transferredAt:
          $ref: "#/components/schemas/DateTime"
        externalReference:
          type: string

    # Core Document - Core Schemas
    DocumentUuid:
      type: string
      format: uuid
      description: "Document UUID."
      pattern: '[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}'

    CoreDocumentId:
      type: object
      #required: (v1: J'ai honte mais c'est à cause du service GET {input,output}/documents qui ne renvoie pas systématiquement un id tant que le stock n'aura pas été migré...)
      #  - id
      properties:
        id:
          $ref: "#/components/schemas/DocumentUuid"

    CoreDocumentIdsAndType:
      type: object
      allOf:
        - $ref: "#/components/schemas/CoreDocumentId"
      required:
        #- legacyId Commented out for v2
        - documentType
      properties:
        legacyId:
          $ref: "#/components/schemas/LegacyId"
        documentType:
          type: string
          enum: [INPUT, OUTPUT]

    CoreDocument:
      type: object
      description: "Represents the common core features of both input and output documents."
      allOf:
        - $ref: "#/components/schemas/CoreDocumentIdsAndType"
        - $ref: "#/components/schemas/CreationAudit"
        - $ref: "#/components/schemas/ModificationAudit"
      properties:
        archivingRequests:
          type: array
          items:
            $ref: "#/components/schemas/ArchivingRequest"
        #archivableContent:
        #  $ref: '#/components/schemas/DocumentContentVersion'
        archivingState:
          $ref: "#/components/schemas/ArchivingState"
        associations:
          type: array
          description: "Array of associations."
          items:
            $ref: "#/components/schemas/DocumentAssociation"
        content:
          $ref: "#/components/schemas/DocumentContentVersion"
        #datamatrix:
        #  $ref: '#/components/schemas/DatamatrixId'
        description:
          type: string
          description: "Description du document."
        metadata:
          type: object
          nullable: true
          description: "Client metadata."
        lock:
          $ref: "#/components/schemas/NullableDocumentLock"
        transfers:
          type: array
          items:
            $ref: "#/components/schemas/Transfer"

    CoreDocumentCreateBody:
      type: object
      required:
        - description
      properties:
        associations:
          type: array
          items:
            $ref: "#/components/schemas/DocumentAssociationCreateBody"
        content:
          $ref: "#/components/schemas/DocumentContentCreationBody"
        description:
          type: string
          description: "Description du document."
        #metadata:
        #  type: object
        #  description: 'Client metadata.'

    CoreDocumentUpdateBody:
      type: object
      properties:
        description:
          type: string
          description: "Description du document."
        #metadata:
        #  type: object
        #  description: 'Client metadata.'

    DocumentAssociation:
      type: object
      description: "Represents a relation between a source document and a target document such as: target document comes from the dissociation of source document."
      properties:
        source:
          $ref: "#/components/schemas/DocumentUuid"
        sourceDocumentType:
          type: "string"
          enum: ["INPUT", "OUTPUT"]
        target:
          $ref: "#/components/schemas/DocumentUuid"
        targetDocumentType:
          type: "string"
          enum: ["INPUT", "OUTPUT"]
        type:
          type: object
          description: "Type of the association such as Merging and Extraction."
          properties:
            id:
              type: string
              description: "Association type identifier."
              enum:
                [
                  "MERGING",
                  "CLONING",
                  "EXTRACTION",
                  "REPLY",
                  "CONVERSION",
                  "REPATRIATION",
                ]
            name:
              type: string
              description: "Association type name."

    DocumentAssociationCreateBody:
      type: object
      description: "Represents a relation between a source document and a target document such as: target document comes from the dissociation of source document."
      oneOf:
        - type: object
          required:
            - source
          properties:
            source:
              $ref: "#/components/schemas/DocumentUuid"
        - type: object
          required:
            - target
          properties:
            target:
              $ref: "#/components/schemas/DocumentUuid"
      properties:
        type:
          type: object
          description: "Type of the association such as Merging and Extraction."
          properties:
            id:
              type: string
              description: "Association type identifier."
              enum:
                [
                  "MERGING",
                  "CLONING",
                  "EXTRACTION",
                  "REPLY",
                  "CONVERSION",
                  "REPATRIATION",
                ]

    DocumentCommentUuid:
      type: string
      format: uuid
      description: "Comment UUID."

    DocumentCommentId:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/DocumentCommentUuid"

    DocumentComment:
      type: object
      description: "Represents the comment on a document."
      allOf:
        - $ref: "#/components/schemas/DocumentCommentId"
      properties:
        text:
          type: string
          description: "Text of the comment."
        commentedAt:
          $ref: "#/components/schemas/DateTime"
        commentedByApp:
          $ref: "#/components/schemas/App"
        commentedByUser:
          $ref: "#/components/schemas/User"

    DocumentContent:
      type: object
      description: "Represents the content (binary) of a document."
      properties:
        checksum:
          type: object
          properties:
            fingerprint:
              type: string
            method:
              type: string
              enum: [MD5, SHA1, SHA256, SHA512]
        conversionState:
          type: object
          description: "Conversion state of the content."
          properties:
            id:
              type: string
              description: "Conversion state identifier."
              enum:
                [
                  "NO_CONVERSION",
                  "PENDING_CONTENT_CONVERSION",
                  "CONTENT_CONVERSION_FAILED",
                  "CONTENT_CONVERSION_SUCCEEDED",
                ]
            name:
              type: string
              description: "Conversion state name."
        datamatrix:
          $ref: "#/components/schemas/Datamatrix"
        id:
          type: "string"
          format: "uuid"
        mimeType:
          type: string
          description: "Mime-Type of the content."
        pageCount:
          type: integer
          description: "Number of pages of the content."
        originalFilename:
          type: string
          description: "Name of the content."
        original:
          type: boolean
          description: "Content is an original (business speaking; e.g. a scanned signed BA)"
        signed:
          type: boolean
          description: "Content is signed"
        readPasswordProtected:
          type: boolean
          description: "The content is password protected for reading"
        writePasswordProtected:
          type: boolean
          description: "The content is password protected for writing"
        certified:
          type: boolean
          description: "All the signatures of the content are valid"
        size:
          type: integer
          format: int64
          description: "Size in ko."
        uploadingState:
          type: object
          description: "Uploading state of the content."
          properties:
            id:
              type: string
              description: "Uploading state identifier."
              enum:
                [
                  "NO_CONTENT_UPLOAD",
                  "PENDING_CONTENT_UPLOAD",
                  "CONTENT_UPLOAD_ABORTED",
                  "CONTENT_UPLOAD_SUCCEEDED",
                ]
            name:
              type: string
              description: "Uploading state name."
        #thumbnails:
        #  $ref: '#/components/schemas/DocumentContentThumbnails'
        url:
          type: string
          description: "URL to access the temporary download URL."
        virusScanningState:
          type: object
          description: "Virus scanning state of the content."
          properties:
            id:
              type: string
              description: "Virus scanning state identifier."
              enum:
                [
                  "NO_VIRUS_SCANNING",
                  "PENDING_VIRUS_SCANNING",
                  "QUARANTINED",
                  "VIRUS_SAFE",
                ]
            name:
              type: string
              description: "Virus scanning state name."

    DocumentContentCreationBody:
      type: object
      required:
        - mimeType
      properties:
        checksum:
          type: object
          properties:
            fingerprint:
              type: string
            method:
              type: string
              enum: [MD5, SHA1, SHA256]
        datamatrix:
          $ref: "#/components/schemas/DatamatrixId"
        original:
          type: boolean
          description: "Content is an original (business speaking; e.g. a scanned signed BA)"
        mimeType:
          type: string
          description: "Mime-Type of the content."

    DocumentContentUpdateBody:
      type: object
      properties:
        checksum:
          type: object
          properties:
            fingerprint:
              type: string
            method:
              type: string
              enum: [MD5, SHA1, SHA256]
        datamatrix:
          $ref: "#/components/schemas/DatamatrixId"
        original:
