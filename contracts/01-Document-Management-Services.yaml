  version: "Swagger: 2.1.9 | DMS: 3.13.18"
  description: |
    This is the documentation of the Document Management Services API (DMS API).

    The french version of the document is available [here](https://www.youtube.com/watch?v=dQw4w9WgXcQ).

    DMS v1 is a proxy to the legacy piece application (with some additionnal features).
    The second version does not ensure the legacy retrocompatibility.
    Services flagged as deprecated are in fact not yet available and will be released in future version. Maybe. Or not.
    Please be aware that the services are described as a target (v2) and that there might be some limitations in the v1 of DMS.

    <details><summary>__Authentication__</summary>
    * EntraID authentication method
      * The EntraID is the privileged authentication method.
      * The client application must obtain a token from EntraID, using oAuth2.
      * The token must be given to DMS via an `Authorisation: Bearer <token>` header.
    * Crowd authentication method
      * Client applications must authenticate to DMS using oAuth2 / Client Credentials Flow
      * Behind the scene, DMS requests CROWD to authenticate the client application and retrieve its roles
      * DMS generates an access token containing the roles of the client application
      * This access token is then used to access the differents resources of DMS
      * When an access token has expired, the client application may retrieve a new access token using the refresh service with the provided refresh token instead of using the auth service
      * When the refresh token becomes invalid, the client application shall re-authenticate itself to get a new access token and a new refresh token
    * __A client application shall not ask for a new token every time it needs to access a DMS service because:__
      * It would overload DMS (token creation)
      * It would overload CROWD (retrieving the roles)
      * It would increase password communications
    * oAuth2/clientCredentials specifications:
      * grant_type must be `client_credentials`;
      * client_id and client_secret must be send in an `Authorization` header: "Basic base64_encoded(client_id:client_secret)"
        * Clients in possession of a client password MAY use the HTTP Basic authentication scheme as defined in [RFC2617] to authenticate with the authorization server [...] The authorization server MUST support the HTTP Basic authentication scheme for authenticating clients that were issued a client password.
          Including the client credentials in the request-body using the two parameters is NOT RECOMMENDED and SHOULD be limited to clients unable to directly utilize the HTTP Basic authentication scheme (or other password-based HTTP authentication schemes).

    ![Simple DMS Authentification Flow](/static/docs/swagger/img/DMS_Authentication_Flow_Simple.png)

    * When an access has expired, the client application shall retrieve a new access token using the refresh token provided by the auth service
    * Only in the case of the refresh token being invalidated, the client application shall re-authenticate itself to get a new access token and a new refresh token

    ![Complete DMS Authentification Flow](/static/docs/swagger/img/DMS_Authentication_Flow_Complete.png)
    </details>

    <details><summary>__Core Document features__</summary>
    * __UUID vs Legacy Id__
      * For a transition period, all services (v1) accept legacy id (aka code pièce) instead of the new document UUID.
      * However we DO NOT recommend to do so as it won't last for long!
      * In v2, we don't accept legacy code nor return them. We might only provide a webservice to map one to another.
      * The annual risk of a given person being hit by a meteorite is estimated to be one chance in 17 billion, which means the probability is about 0.00000000006 (6 × 10−11), equivalent to the odds of creating a few tens of trillions of UUIDs in a year and having one duplicate. In other words, only after generating 1 billion UUIDs every second for the next 100 years, the probability of creating just one duplicate would be about 50%.
      * The only thing we understood is that there was a fifty/fifty chance to get the same UUID twice. It seems a lot but we take the risk... :)

    * __2 steps creation__
      * Documents are first created without any content.
      * A temporary upload URL is retrieved at the creation.
      * The content can then be uploaded to its destination.
      * The content will be processed until its available to end users.

    * __2 steps content access__
      * A temporary download URL is retrieved as a redirection when accessing a document content.
      * The content can be downloaded from this URL.

    * __Document group__
      Documents can be grouped inside a document group.
      An input document is grouped into one and only one reception group.
      An output document is grouped into one and only one creation group, and zero or more transmission groups.

    * __Content processing workflow__
      * Content added to DMS will go through a serie of processes. Examples given:
        * Virus scanning;
        * Document conversion;
        * Thumbnails generation;
        * Document recognition;
        * Features extraction;
        * Etc.

      * The content has various states describing the processing that might be applied to it:
        * `uploadingState`:
          | Id                        | Name                     | Description                                                                       |
          | ------------------------- | ------------------------ | --------------------------------------------------------------------------------- |
          |  NO_CONTENT_UPLOAD        | No Content Upload        | For documents with no content but only metadata, there shall be no content upload |
          |  PENDING_CONTENT_UPLOAD   | Pending Content Upload   | Waiting for the content to be uploaded                                            |
          |  CONTENT_UPLOAD_ABORTED   | Content Upload Aborted   | The upload of the content has been aborted                                        |
          |  CONTENT_UPLOAD_SUCCEEDED | Content Upload Succeeded | The content has been uploaded                                                     |
        * `virusScanningState`:
          | Id                      | Name                   | Description                                                        |
          | ----------------------- | ---------------------- | ------------------------------------------------------------------ |
          |  NO_VIRUS_SCANNING      | No Virus Scanning      | Etienne must never know about this state                           |
          |  PENDING_VIRUS_SCANNING | Pending Virus Scanning | Waiting for the content to be virus scanned                        |
          |  QUARANTINED            | Quarantined            | Virus has been detected in the content and it is put in quarantine |
          |  VIRUS_SAFE             | Virus Safe             | The content is virus safe                                          |
        * `conversionState`:
          | Id                            | Name                         | Description                               |
          | ----------------------------- | ---------------------------- | ----------------------------------------- |
          |  NO_CONVERSION                | No Conversion                | No conversion is required for the content |
          |  PENDING_CONTENT_CONVERSION   | Pending Content Conversion   | Waiting for the content to be converted   |
          |  CONTENT_CONVERSION_FAILED    | Content Conversion Failed    | The conversion has failed                 |
          |  CONTENT_CONVERSION_SUCCEEDED | Content Conversion Succeeded | The conversion has succeeded              |

    * __Pagination__
      * List responses are paginated but, in v1, with no guarantee that two sequential requests will not overlap or miss a document as some new document may appear and others may vanish.

    * __Versioning__
      * The content of a document is versioned for audit purpose.
      * A document can reference several ordered versioned contents.
      * Accessing the content of a document is equivalent to retrieve the most recent active version of the content.
      * Modifying the content of the document creates a new version of the content.
      * A new content go through its processing workflow (antivirus, conversion, etc.).
      * A version is active when all the processing are over.

    * __Cloning__
      * Cloning a document creates a new document (input or output) with a duplicate content.
      * All the properties of the document are duplicated.
      * The new document is linked to the original one by a `Cloning` relationship association.
      * The application which cloned the document becomes the owner of the new document.

    * __Archiving__
      * Only the owner of a document can archive it. (Not yet implemented)
      * By default, the owner of a document is its creator.
      * An application can take ownership of a document by binding it.
      * When a document is declared, restricted or destroyed you can't update this document. You can still clone it.
      * 4 levels of archiving are defined:
        | Id          | Name       | Description                                                                                       |
        | ----------  | ---------- | ------------------------------------------------------------------------------------------------- |
        |  CURRENT    | Current    | The document is in the current archive (archivage courant)                                        |
        |  DECLARED   | Declared   | The document has been declared as a record                                                        |
        |             |            | * Access to the content is read only                                                              |
        |             |            | * The content of the document can't be modified (no new version can be created)                   |
        |             |            | * If the document has to be modified, it first must be cloned                                     |
        |  RESTRICTED | Restricted | The access to the document is restricted (archivage intermédiaire)                                |
        |             |            | * Access to the properties and the content is restricted to archivist profile                     |
        |  DESTROYED  | Destroyed  | The document is destroyed (archivage définitif = suppression)                                     |
        |             |            | * Access to the document is immediatly forbidden                                                  |
        |             |            | * The document is programmed to be destroyed.                                                     |
        |             |            | * The properties will be anonymized and the link to the content will be destroyed                 |
        |             |            | * Orphan contents are to be finally destroyed                                                     |
    </details>

    <details><summary>__Input Document features__</summary>
    * __Reception group__
      * An input document is created inside a reception group, or a reception is created for it.
      * An input document can only be part of a reception group.
      * A reception represents the canal and the expedient a group of documents is received from.

    * __Input document processing workflow__
      * This workflow only describes the inbox workflow.
      * A closed document doesn't necessary mean that the document has been processed by the full case workflow. It just means that it has been processed in the inbox workflow.

      * Processing states:
        | Id                  | Name                  | Description                                                                                        |
        | ------------------- | --------------------- | -------------------------------------------------------------------------------------------------- |
        |  READY              | Ready                 | The input document is ready to be processed by an application                                      |
        |  PENDING_INDEXATION | Pending Indexation    | Waiting for the input document to be indexed by an operator                                        |
        |  PENDING_PROCESSING | Pending Processing    | Waiting for the input document to be processed by an operator                                      |
        |  BOUND              | Bound                 | The input document is bound (by an operator or an automated system)                                |
        |  MANIPULATED        | Manipulated           | The input document is manipulated (merge, extraction, clone)                                       |
        |  ARCHIVED           | Archived              | The input document is not intended for an operator, and has to be created archived                 |
        |  PROCESSED          | Processed             | The input document is intended for an operator, processed, without being bound                     |

    * __Binding__
      * Binding is taking ownership of a document for a specific case.
      * Binding should be YOBO (You Only Bind Once).
      * If you need to bind your document several times (to several cases or by several applications), you need to clone it.
      * A bound document is automatically declared as an archive (read only).
      * If a document is unbound, its ownership is reverted to its creator which should handle the archiving process.
    </details>

    <details><summary>__Output Document features__</summary>
    * __Transmission group__
      * An output document may be part of one or several transmission groups.
      * A transmission represents the canal and the recipient a group of documents is delivered to.

    * __Output document transmission delivery workflow__
      * This worklow only represents the delivery workflow of a transmission.
      * Delivery states:
        | Id                  | Name               | Description                                  |
        | ------------------- | ------------------ | -------------------------------------------- |
        |  CREATED            | Created            | The transmission has been created            |
        |  PENDING_DELIVERY   | Pending Delivery   | Waiting for the transmission to be delivered |
        |  DELIVERY_CANCELED  | Delivery Canceled  | The transmission has been canceled           |
        |  DELIVERING         | Delivering         | The transmission is being transmitted        |
        |  DELIVERY_SUCCEEDED | Delivery Succeeded | The transmission has succeeded               |
        |  DELIVERY_FAILED    | Delivery Failed    | The transmission has failed                  |

      * Rules :
        * You can't update the content of a document belonging to a transmission
        * You can't cut off a document belonging to a transmission until the transmission is delivered, is canceled or has failed.
        * You can't destroy a document belonging to a transmission until the transmission is delivered, is canceled or has failed.
        * You can declare a document as an archive whatever the transmission it belongs to
        * When a transmission is delivered, its documents are declared as records
        * Neither a cut off or destroyed document can be added to a transmission
    </details>

