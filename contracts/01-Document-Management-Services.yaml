    User:
      type: object
      description: "Represents a user."
      required:
        - name
      allOf:
        - $ref: "#/components/schemas/UserId"
      properties:
        name:
          type: string
          description: "User name (v1: user profile)."

    WarrantyId:
      type: object
      required:
