  #
  # SLA
  #

  ############################################################
  "/private/secure/sla":
    ############################################################

    # POST /private/secure/sla
    post:
      tags:
        - SLA
      summary: "Creating a sla configuration"
      description: |
        * This service creates a SLA configuration.
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderFeatureFlag"
        - $ref: "#/components/parameters/HeaderImpersonateApp"
        - $ref: "#/components/parameters/RequiredHeaderUserProfile"
        - $ref: "#/components/parameters/RequiredHeaderUserAgent"
      requestBody:
        $ref: "#/components/requestBodies/SlaCreationRequestBody"
      responses:
        "201":
          $ref: "#/components/responses/SlaCreationCreatedResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        default:
          $ref: "#/components/responses/UnexpectedErrorResponse"

    # GET /private/secure/sla
    get:
      tags:
        - SLA
      summary: "Listing all SLAs"
      description: |
        * This service lists all SLA configurations.
        * Paging:
          * The service takes three query parameters to handle paging:
            * limit: the maximum number of element to retrieve
            * offset: the index of the first element to be retrieved
            * totalCount: true if the total count of elements that can be retrieved shall be returned
          * The service returns a `_links` node with links to:
            * the `first` element
            * the `previous` element (if there is one)
            * the `next` element (if there is one)
          * The service returns a `totalCount` element if the associated query param is true.
            * the `last` element (if `totalCount = true` ; strongly discouraged for performance issue)
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderFeatureFlag"
        - $ref: "#/components/parameters/HeaderImpersonateApp"
        - $ref: "#/components/parameters/RequiredHeaderUserProfile"
        - $ref: "#/components/parameters/RequiredHeaderUserAgent"
        - $ref: "#/components/parameters/ContentRangeLimit"
        - $ref: "#/components/parameters/ContentRangeOffset"
        - $ref: "#/components/parameters/ContentRangeTotalCount"
      responses:
        "200":
          $ref: "#/components/responses/SlaListOKResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        default:
          $ref: "#/components/responses/UnexpectedErrorResponse"

  ############################################################
  "/private/secure/sla/{slaUuid}":
    ############################################################

    # GET /private/secure/sla/{slaUuid}
    get:
      tags:
        - SLA
      summary: "Retrieving a SLA configuration"
      description: |
        * This service retrieves a SLA configuration.
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderFeatureFlag"
        - $ref: "#/components/parameters/HeaderImpersonateApp"
        - $ref: "#/components/parameters/RequiredHeaderUserProfile"
        - $ref: "#/components/parameters/RequiredHeaderUserAgent"
        - $ref: "#/components/parameters/RequiredPathSlaUuid"
      responses:
        "200":
          $ref: "#/components/responses/SlaGetOKResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "410":
          $ref: "#/components/responses/GoneResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        default:
          $ref: "#/components/responses/UnexpectedErrorResponse"

    # PUT /private/secure/sla/{slaUuid}
    put:
      tags:
        - SLA
      summary: "Updating a SLA configuration"
      description: |
        * This service updates a SLA configuration.
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderFeatureFlag"
        - $ref: "#/components/parameters/HeaderImpersonateApp"
        - $ref: "#/components/parameters/RequiredHeaderUserProfile"
        - $ref: "#/components/parameters/RequiredHeaderUserAgent"
        - $ref: "#/components/parameters/RequiredPathSlaUuid"
      requestBody:
        $ref: "#/components/requestBodies/SlaUpdateRequestBody"
      responses:
        "200":
          $ref: "#/components/responses/SlaUpdateUpdatedResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        default:
          $ref: "#/components/responses/UnexpectedErrorResponse"

    # DELETE /private/secure/sla/{slaUuid}
    delete:
      tags:
        - SLA
      summary: "Deleting an SLA configuration"
      description: |
        * This service deletes a SLA configuration.
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderFeatureFlag"
        - $ref: "#/components/parameters/HeaderImpersonateApp"
        - $ref: "#/components/parameters/RequiredHeaderUserProfile"
        - $ref: "#/components/parameters/RequiredHeaderUserAgent"
        - $ref: "#/components/parameters/RequiredPathSlaUuid"
      responses:
        "204":
          description: "SLA has been deleted."
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        default:
          $ref: "#/components/responses/UnexpectedErrorResponse"

  ############################################################
  # Message Source Resources
  ############################################################
  "/private/secure/i18n/{locale}":
    get:
      tags:
        - Message Source i18n Resources
      summary: Get all messages for locale
      responses:
        "200":
          $ref: "#/components/responses/MessageSourceListOKResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/RequiredHeaderUserProfile"
        - $ref: "#/components/parameters/RequiredHeaderUserAgent"
        - $ref: "#/components/parameters/RequiredHeaderLanguage"
        - $ref: "#/components/parameters/Locale"

components:
  schemas:
    MessageSource:
      type: object
      properties:
        key:
          type: string
          example: message.key
        value:
          type: string
          example: value
    # Common Schemas
    Audit:
      type: object
      required:
        - application
        - requestDate
        - requestMessage
        - requestMethod
        - requestPath
        - responseDate
        - responseMessage
        - responseStatusCode
        - responseTiming
        - serverRequestId
        - userProfile
      properties:
        application:
          type: string
        clientRequestId:
          type: string
          format: uuid
        requestDate:
          type: string
          format: date-time
        documentsUuid:
          type: array
          items:
            type: string
            format: uuid
        requestMessage:
          type: string
        requestMethod:
          type: string
          enum: ["POST", "PUT", "GET", "PATCH", "DELETE"]
        requestPath:
          type: string
        responseDate:
          type: string
          format: date-time
        responseMessage:
          type: string
        responseStatusCode:
          type: integer
        responseTiming:
          type: integer
        serverRequestId:
          type: string
          format: uuid
        userProfile:
          type: string

    CreationAudit:
      type: object
      #required:
      #- createdAt
      #- createdByApp
      #- createdByUser
      properties:
        createdAt:
          $ref: "#/components/schemas/CreationDateTime"
        createdByApp:
          $ref: "#/components/schemas/App"
        createdByUser:
          $ref: "#/components/schemas/User"

    NullableCreationAudit:
      type: object
      nullable: true
      properties:
        createdAt:
          $ref: "#/components/schemas/CreationDateTime"
        createdByApp:
          $ref: "#/components/schemas/App"
        createdByUser:
          $ref: "#/components/schemas/User"

    ModificationAudit:
      type: object
      #required:
      #- modifiedAt
      #- modifiedByApp
      #- modifiedByUser
      properties:
        modifiedAt:
          $ref: "#/components/schemas/ModificationDateTime"
        modifiedByApp:
          $ref: "#/components/schemas/App"
        modifiedByUser:
          $ref: "#/components/schemas/User"

    NullableModificationAudit:
      type: object
      nullable: true
      properties:
        modifiedAt:
          $ref: "#/components/schemas/ModificationDateTime"
        modifiedByApp:
          $ref: "#/components/schemas/App"
        modifiedByUser:
          $ref: "#/components/schemas/User"

    ActivityId:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int32
          description: "Activity identifier."

    Activity:
      type: object
      description: "Represents an activity (Related Product, Non Related Product, Pension)"
      allOf:
        - $ref: "#/components/schemas/ActivityId"
      properties:
        name:
          type: string
          description: "Activity name such as RP, NRP or Pension."

    JobParam:
      type: object
      properties:
        jobKey:
          type: string
        jobValue:
          type: string

    JobKey:
      type: object
      description: "Represents a job description"
      required:
        - name
        - group
        - triggers
      properties:
        name:
          type: string
        group:
          type: string
        triggers:
          type: array
          description: "Array of associations."
          items:
            $ref: "#/components/schemas/JobTrigger"

    AppUuid:
      type: string
      format: uuid
      description: "Application identifier."

    AppId:
      type: object
      required:
        - id
      properties:
        id:
          $ref: "#/components/schemas/AppUuid"

    App:
      type: object
      description: "Represents a client application."
      required:
        - name
      allOf:
        - $ref: "#/components/schemas/AppId"
      properties:
        name:
          type: string
          description: "Application name."

    JobTrigger:
      type: object
      description: "Represents a job quartz trigger ."
      required:
        - description
        - cron
        - status
        - nextFireDate
      properties:
        description:
          type: string
          description: "Trigger name."
        cron:
          type: string
          description: "cron trigger (crontab expression)"
        status:
          type: string
          description: "trigger status."
        nextFireDate:
          $ref: "#/components/schemas/FireDateTime"

    ExtendedApp:
      type: object
      description: "Represents a client application."
      allOf:
        - $ref: "#/components/schemas/App"
      required:
        - branch
      properties:
        identityProviderId:
          type: string
        branch:
          type: string
        features:
          type: array
          items:
            type: string
        legacyRelativePathIds:
          type: object
          properties:
            input:
              type: integer
            output:
              type: integer
        userTokenRequired:
          type: boolean

    ApplicationCreateBody:
      type: object
      required:
        - name
        - branch
      properties:
        name:
          type: string
        identityProviderId:
          type: string
        branch:
          type: string
        legacyRelativePathIds:
          type: object
          properties:
            input:
              type: integer
            output:
              type: integer
        userTokenRequired:
          type: boolean

    ApplicationUpdateBody:
      type: object
      properties:
        name:
          type: string
        identityProviderId:
          type: string
        branch:
          type: string
        legacyRelativePathIds:
          type: object
          properties:
            input:
              type: integer
            output:
              type: integer
        userTokenRequired:
          type: boolean

    # SLA

    SlaUuid:
      type: string
      format: uuid
      description: "SLA identifier."

    SlaId:
      type: object
      required:
        - id
      properties:
        id:
          $ref: "#/components/schemas/SlaUuid"

    Sla:
      type: object
      description: "Represents a SLA."
      required:
        - name
        - refId
        - subsidiary
        - activity
        - domain
        - urgentDelayUnit
        - urgentDelay
        - deadlineDelayUnit
        - deadlineDelay
      properties:
        refId:
          type: integer
          descripton: "SLA reference Id"
        name:
          type: string
          description: "SLA name."
        subsidiary:
          type: integer
          descripton: "Subsidiary Reference Id"
        activity:
          type: integer
          descripton: "Activity Reference Id"
        domain:
          type: integer
          descripton: "Domain Reference Id"
        family:
          type: integer
          descripton: "Family Reference Id"
        distributor:
          type: integer
          descripton: "Distributo Reference Id"
        insurer:
          type: integer
          descripton: "Insurer Reference Id"
        receptionType:
          type: string
          descripton: "Reception Type"
          enum:
            [
              "INPUT_BACK_OFFICE",
              "INPUT_CONTACT_CENTER",
              "INPUT_EDI",
              "INPUT_EMAIL",
              "INPUT_FAX",
              "INPUT_MAIL",
              "INPUT_CUSTOMER_UPLOAD",
              "INPUT_SALES_TOOL",
            ]
        urgentDelay:
          type: integer
          descripton: "Urgent Delay"
        urgentDelayUnit:
          type: string
          descripton: "Urgent Delay Unit"
          enum: ["SECOND", "DAY"]
        deadlineDelay:
          type: integer
          descripton: "Deadline Delay"
        deadlineDelayUnit:
          type: string
          descripton: "Deadline Delay Unit"
          enum: ["SECOND", "DAY"]
        calculationMode:
          type: string
          descripton: "Deadline Delay Unit"
          enum:
            ["BUSINESS_DELAY", "BUSINESS_DELAY_EXCLUDING_FIRST_BUSINESS_DAY"]

    ExtendedSla:
      type: object
      description: "Represents a SLA with its id and refId."
      required:
        - subsidiary
        - activity
        - domain
      allOf:
        - $ref: "#/components/schemas/Sla"
        - $ref: "#/components/schemas/SlaId"
      properties:
        modifiedAt:
          $ref: "#/components/schemas/ModificationDateTime"

    SlaCreateBody:
      type: object
      allOf:
        - $ref: "#/components/schemas/Sla"

    SlaUpdateBody:
      type: object
      allOf:
        - $ref: "#/components/schemas/Sla"

    # End of SLA

    DateTime:
      type: string
      format: date-time
      description: "Date/time."

    ArchivingDateTime:
      type: string
      format: date-time
      description: "Archiving date/time."

    FireDateTime:
      type: string
      format: date-time
      description: "Next Fire date/time."

    CreationDateTime:
      type: string
      format: date-time
      description: "Creation date/time"

    DeliveryDateTime:
      type: string
      format: date-time
      description: "Delivery date/time"

    LockingDateTime:
      type: string
      format: date-time
      description: "Locking date/time."

    ModificationDateTime:
      type: string
      format: date-time
      description: "Last modification date/time"

    SlaDeadlineDateTime:
      type: string
      format: date-time
      description: "The deadline date/time to respect the SLA of processing this document."

    SlaUrgencyDateTime:
      type: string
      format: date-time
      description: "The urgency date/time to indicate that the document should be processed urgently to respect the SLA."

    SlaProrityEnum:
      type: string
      enum: [URGENT, NON_URGENT, NO_SLA, OVERDUE]
      description: "Priority of processing this document to respect the SLA."

    TriggeringDateTime:
      type: string
      format: date-time
      description: "Triggering date/time."

    Error:
      type: object
      properties:
        status:
          type: integer
          format: int32
          description: "Error status."
          example: 400
        code:
          type: string
          description: "Error code."
          example: "403.5.3"
        title:
          type: string
          description: "Error title."
          example: "Bad Request"
        path:
          type: string
          description: "Path error"
          example: "/private/secure/input/documents"
        message:
          type: string
          description: "Error message."
          example: "Validation fields failed: [subsidiary, domain, activity]"

    CoverId:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int32
          description: "Cover identifier."

    Cover:
      type: object
      description: "Represents a cover."
      required:
        - name
      allOf:
        - $ref: "#/components/schemas/CoverId"
      properties:
        name:
          type: string
          description: "Cover name."

    NullableCover:
      type: object
      nullable: true
      allOf:
        - $ref: "#/components/schemas/Cover"

    DistributorEntityId:
      type: object
      properties:
        id:
          type: integer
          format: int32
          description: "Entity identifier."

    DistributorEntityInternalCode:
      type: object
      properties:
        internalCode:
          type: integer
          format: int32
          description: "Distributor entity internal code (aka agency code)."

    DistributorEntity:
      type: object
      description: "Represents a distributor's entity (aka agency in the legacy)."
      #required:
      #  - name (sometimes there's no agency name although there is an agency code...)
      allOf:
        - $ref: "#/components/schemas/DistributorEntityId"
        - $ref: "#/components/schemas/DistributorEntityInternalCode"
      properties:
        name:
          type: string
          description: "Entity name."

    DistributorId:
      type: object
      #required:
      #  - id
      properties:
        id:
          type: integer
          format: int32
          description: "Distributor identifier."

    DistributorInternalCode:
      type: object
      required:
        - internalCode
      properties:
        internalCode:
          type: integer
          format: int32
          description: "Distributor internal code (aka bank code)."

    Distributor:
      type: object
      description: "Represents a distributor."
      required:
        - name
        - shortName
      allOf:
        - $ref: "#/components/schemas/DistributorId"
        - $ref: "#/components/schemas/DistributorInternalCode"
      properties:
        entity:
          $ref: "#/components/schemas/DistributorEntity"
        name:
          type: string
          description: "Distributor name."
        shortName:
          type: string
          description: "Distributor short name."

    NullableDistributor:
      type: object
      nullable: true
      allOf:
        - $ref: "#/components/schemas/Distributor"

    DistributorSetBody:
      type: object
      oneOf:
        # Could be simplified later on by "$ref: '#/components/schemas/DistributorId'" when id would be set as required
        - type: object
          required:
            - id
          properties:
            id:
              type: integer
              format: int32
              description: "Distributor identifier."
        - $ref: "#/components/schemas/DistributorInternalCode"
      properties:
        entity:
          type: object
          oneOf:
            #- $ref: '#/components/schemas/DistributorEntityId'
            - $ref: "#/components/schemas/DistributorEntityInternalCode"

    DomainId:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int32
          description: "Domain identifier."

    Domain:
      type: object
      required:
        - name
      description: "Represents a domain such as Subscription, Postsales, Claim, ..."
      allOf:
        - $ref: "#/components/schemas/DomainId"
      properties:
        name:
          type: string
          description: "Domain name."

    FamilyId:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int32
          description: "Family identifier."

    Family:
      type: object
      description: "Represents a family of document."
      required:
        - name
      allOf:
        - $ref: "#/components/schemas/FamilyId"
      properties:
        name:
          type: string
          description: "Family name."

    FamilyConfiguration:
      type: object
      description: "Represents configuration of a family"
      required:
        - exclusiveFilter
        - mandatoryFilter
        - indexationFilter
      properties:
        subsidiaryId:
          type: integer
          format: int32
          description: "The code of the subsidiary displaying this family"
        activityId:
          type: integer
          format: int32
          description: "The code of the activity displaying this family"
        domainId:
          type: integer
          format: int32
          description: "The code of the domain displaying this family"
        exclusiveFilter:
          type: boolean
          description: "Filter on this family does not display documents without a family."
        mandatoryFilter:
          type: boolean
          description: "A filter on this family is required when searching in order to see the documents belonging to this family."
        indexationFilter:
          type: boolean
          description: "The family is visible in the indexing application"

    NullableFamily:
      type: object
      nullable: true
      allOf:
        - $ref: "#/components/schemas/Family"

    GroupId:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int32
          description: "Group identifier."

    Group:
      type: object
      required:
        - name
      allOf:
        - $ref: "#/components/schemas/GroupId"
      properties:
        name:
          type: string
          description: "Group name."

    NullableGroup:
      type: object
      nullable: true
      allOf:
        - $ref: "#/components/schemas/Group"

    Insured:
      type: object
      description: "Represents the insured."
      properties:
        firstName:
          type: string
          description: "Insured first name."
        lastName:
          type: string
          description: "Insured last name."

    NullableInsured:
      type: object
      nullable: true
      allOf:
        - $ref: "#/components/schemas/Insured"

    InsurerId:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int32
          description: "Insurer identifier."

    Insurer:
      type: object
      description: "Represents the insurer."
      required:
        - name
        - shortName
      allOf:
        - $ref: "#/components/schemas/InsurerId"
      properties:
        name:
          type: string
          description: "Insurer name."
        shortName:
          type: string
          description: "Insurer short name."

    NullableInsurer:
      type: object
      nullable: true
