      properties:
        reference:
          type: string
        receptions:
          type: array
          items:
            $ref: "#/components/schemas/Reception"

    ExtendedInputDocument:
      type: object
      allOf:
        - $ref: "#/components/schemas/CoreDocument"
      properties:
        binding:
          $ref: "#/components/schemas/NullableDocumentBinding"
        events:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        indexation:
          $ref: "#/components/schemas/InputIndexationProperties"
        permissions:
          $ref: "#/components/schemas/InputPermissionsProperties"
        processingState:
          $ref: "#/components/schemas/InputDocumentProcessingState"
        receptionOrder:
          type: integer
          description: "Ordre de reception du document."
        reception:
          $ref: "#/components/schemas/Reception"
        sla:
          $ref: "#/components/schemas/NullableSlaProperties"

    ExtendedInputDocumentWithoutEvents:
      type: object
      allOf:
        - $ref: "#/components/schemas/CoreDocument"
      properties:
        binding:
          $ref: "#/components/schemas/NullableDocumentBinding"
        indexation:
          $ref: "#/components/schemas/InputIndexationProperties"
        permissions:
          $ref: "#/components/schemas/InputPermissionsProperties"
        processingState:
          $ref: "#/components/schemas/InputDocumentProcessingState"
        reception:
          $ref: "#/components/schemas/Reception"
        sla:
          $ref: "#/components/schemas/NullableSlaProperties"

    InputDocumentCreateBody:
      type: object
