  "/private/secure/output/documents/{documentUuid}/content/upload":
    ############################################################

    # PUT /private/secure/output/documents/{documentUuid}/content/upload
    put:
      tags:
        - Output Document - Content
      summary: "Uploading output document content"
      description: |
        * This service will only be available in the first versions of DMS until the legacy system is shutdown.
        * It acts as a proxy to a legacy service and mimic the target AWS S3 service that will be used to directly upload content to a S3 bucket.
        * It's forbidden to upload a content to a document that belongs to a transmission.
        * __v1:__
          * This services takes a unique form field parameter, a UUID, that is provided when calling the PUT /private/secure/output/documents/{documentUuid}/content service.
          * Starting v1, you must ensure that you call this service with all the form fields returned in the previously mentionned service. If you do not, you won't be able to update content in some next release.
      requestBody:
        $ref: "#/components/requestBodies/OutputDocumentUploadContentRequestBody"
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderFeatureFlag_Update"
        - $ref: "#/components/parameters/HeaderImpersonateApp"
        - $ref: "#/components/parameters/RequiredHeaderUserProfile"
        - $ref: "#/components/parameters/RequiredHeaderUserAgent"
        - $ref: "#/components/parameters/RequiredHeaderLanguage"
        - $ref: "#/components/parameters/RequiredPathDocumentUuid"
        - name: securityToken
          in: query
          description: "A short term lived token provided with the URL from the PUT /private/secure/output/documents/{documentUuid}/content."
          schema:
            type: string
      responses:
