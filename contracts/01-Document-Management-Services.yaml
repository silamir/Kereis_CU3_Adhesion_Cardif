    <details><summary>__Actual use cases__</summary>
    * __A case handler wants to (finally) bind an input document in an inbox from an application to a case__
      * Without cloning:
        * The application can `bind` the input document to its case with `close` parameter set to `true`
        * (alternative 1) The application can first `bind` the document, and then `close` it (not available in v1)
      * With cloning:
          * The application can `bind` the input document to its case with `close` parameter set to `true` and `clone` parameter set to `true`
        * (alternative 1) The application can first `clone` the document (with processing state set to `Closed`), then `bind` it with `close` parameter set to `true`
        * (alternative 2) The application can first `clone` the document (with processing state set to `Closed`), then `bind` it, and finally `close` it
        * The archiving cycle of the original input document will be handled by its creator.
      * The document disappears from the inbox (because the document has been closed).
      * If the application doesn't close the document, it might be done by the case handler in the inbox application (`close` service).

    * __A case handler wants to bind an input document in an inbox from an application to two cases__
      * With cloning on all but the first binding:
        * The application can `bind` the input document to its first case with `close` parameter set to `false`
        * The application can `bind` the input document to its second case with `close` parameter set to `true` and `clone` parameter set to `true`
      * With cloning on all but the last binding:
        * The application can `bind` the input document to its first case with `close` parameter set to `false` and `clone` parameter set to `true`
        * The application can `bind` the input document to its second case with `close` parameter set to `true`
      * With cloning on all bindings:
        * The application can `bind` the input document to its first case with `close` parameter set to `false` and `clone` parameter set to `true`
        * The application can `bind` the input document to its second case with `close` parameter set to `true` and `clone` parameter set to `true`

    * __A case handler wants to bind an input document in an inbox from two applications to one case each__
      * With cloning on all but the last binding:
        * The first application can `bind` the input document to its case with `close` parameter set to `false` and `clone` parameter set to `true`
        * The second application can `bind` the input document to its case with `close` parameter set to `true`
      * With cloning on all bindings:
        * The first application can `bind` the input document to its case with `close` parameter set to `false` and `clone` parameter set to `true`
        * The second application can `bind` the input document to its case with `close` parameter set to `true` and `clone` parameter set to `true`

    * __A case handler wants to bind an input document in an inbox from one application to a first case, reindex the document to another inbox, and bind it from a second application to a second case__
        * The first application can `bind` the input document to its case with `close` parameter set to `false` and `clone` parameter set to `true`
        * The handler can reindex the document so that it appears in another inbox (best practice is have cloned it first so that the indexation properties stay consistent to the binding);
        * The second application can `bind` the input document to its case with `close` parameter set to `true` (with cloning or not)

    * __An application wants to bind an input document before it appears in an inbox__
      * The input document should be created with the desired processing state `Closed`.
      * The application can `bind` the document in its `Closed` state.

    * __A case handler has mistakenly finally bound a document to a case and would like to bind it to another document__
      * From the inbox application, the case handler should be able to reopen recently closed document

    * __A case handler has mistakenly bound a document to a case from an application__
      * From the application, the case handler should be able to cancel the binding.
      * If it's a recent document that needs to be sent back to the inbox to be correctly re-processed.
        * The application can `unbind` the document with `reopen` parameter set to `true`.
        * The case handler will have to deal with the reopened document in the inbox application.
      * If it's a document that do not need to be sent back to the inbox
        * The application can `unbind`the document without reopening it.
        * The document is automatically cutoff in that case.

    * __An indexer wants to duplicates an input document (e.g. a fee) in order to be sent to two different inboxes
      * From the indexation application, the case handler can clone an input document and index it differently from the other document so that they go to two different inboxes (e.g. instead of currently printing the document and scanning it with the other fees).

    * __An application wants to send an output document through two different channels__
      * The application creates an output document.
      * The application creates a first transmission to deliver the document through a first channel.
      * The application creates a second transmission to deliver the document through a second channel.
      * The application sends both transmissions so that the document is sent through both channels.

    * __An application wants to send an output document to two different recipients__
      * The application creates an output document.
      * The application creates a first transmission to deliver the document to a first recipient.
      * The application creates a second transmission to deliver the document to a second recipient.
      * The application sends both transmissions so that the document is sent to both recipients.

    * __An application wants to send an output document with an input document__
      * The application creates an output document.
      * The application clones an input document as an output document.
      * The application creates a transmission to deliver both documents.
      * The application sends the transmission so that both documents are delivered.

    * __An application wants to modify the content of an output document__
      * If there is no successfully delivered transmission (`DeliverySucceeded`) and no currently delivering transmission (`Delivering`), an output document content can be modified.
        * A new content version is by the way created.
        * The corresponding pending transmission should be canceled prior to any modification, otherwise the current active version could be delivered instead of the new one.
      If there is a successfully delivered transmission (`DeliverySucceeded`) or a currently delivering transmission (`Delivering`), an output document content can not be modified.
        * A new output document must be created with its required transmission.
    </details>

    <details><summary>__Migration v1 -> v2__</summary>
    * The migration from using v1 to using v2 can be done using database feature flipping or `X-Features` header request feature flipping.
    * When a feature is activated on database side, it takes precedence over the `X-Features` header request
    * The current `X-Features` are (only the 4 first ones are related to the versioning):
      * V1: the default feature for DMS versioning; specify that DMS v1 should be used; if a V2_* feature is used, V1 is ignored
      * V2_READ: specify that DMS v2 should be used for reading services (GET)
      * V2_UPDATE: specify that DMS v2 should be used for updating services
      * V2_CREATE: specify that DMS v2 should be used for creation services
      * USER_AUTHORITIES: specify that the user rights of the User-Profile should be checked
      * LOCAL_TIME: specify that the format should be in local time like this -> 2022-12-01T07:10:18 (default)
      * ZONED_TIME: specify that the format should be zoned like this -> 2022-12-01T06:10:18Z
      * OLD_PROCESSING_STATES: specify that the new processing states `BOUND`, `MANIPULATED` and `ARCHIVED` of the input documents are returned as the old enum `PROCESSED`, in GET services for listing or getting input documents.  
        This feature is enabled by default. If you wish to retrieve these new values, you need to request "DSI-Document-Services-Demande" <dtd-document-services-demande@cbp-group.com> to disable it. 
    * When migrating to DMS v2, you don't need to know which header to pass for each endpoint. The principle is as follow:
      * If you wish to be able to opportunistically read documents/transmissions information from DMS database (which might be more complete than using v1 API) but without updating nor creating v2 documents/transmission => you should use V2_READ X-Feature
      * If you wish to make your application ready to accept v2 documents/transmissions without creating such v2 documents/transmissions, you should:
        * use V1 X-Feature for any endpoint on v1 documents/transmissions
        * use V2_READ and V2_UPDATE for any endpoint on v2 documents/transmissions (V2_UPDATE on GET endpoints will be ignored and vice versa)
      * If you wish furthermore to activate the creation of new documents/transmissions in v2, you should:
        * use V1 X-Feature for any endpoint on v1 documents/transmissions
        * use V2_READ, V2_UPDATE and V2_CREATE for any endpoint
    </details>

