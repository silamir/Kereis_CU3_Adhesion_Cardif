    # POST /private/secure/output/documents/{documentUuid}/declare
    post:
      tags:
        - Output Document - Archiving
      summary: "Declaring an output document as a record (archive)"
      description: |
        * Changes the archiving status of the document to `DECLARED`.
        * From this state, the document is read only.
        * For quality data management requirement, some indexation values are mandatory (domain, activity, subsidiary).
        * Document Archiving State must be CURRENT
        * A `DOCUMENT_DECLARED` event is triggered as the document is declared as a record.
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderFeatureFlag_Update"
