          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "409":
          $ref: "#/components/responses/ConflictResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        default:
          $ref: "#/components/responses/UnexpectedErrorResponse"

  #
  # OUTPUT DOCUMENT - CORE
  #

  ############################################################
  "/private/secure/output/documents":
    ############################################################

    # POST /private/secure/output/documents
    post:
      tags:
        - Output Document - Core
      summary: "Creating an output document"
      description: |
        * This service creates an output document with its metadata in the archive status `CURRENT`.
        * The service returns an upload URL in the response body.
        * The content has to be uploaded in a second time using this upload URL.
        * Once the content is uploaded, it will go through a series of processes (antivirus, document conversion, document recognition, text extraction, etc.)
        * In order to create an output document within an existing output creation group, one needs to specify the output creation group parameter with the output group UUID of an output document already in this group. Otherwise, a new creation group will be created.
        * Documents can be associated in a group by specifying a group UUID at the creation. If not specified, a new group is created and the returned group UUID can be used for grouping.
        * The MIME type accepted is subject to a whitelist.
        * A `DOCUMENT_CREATED` event is triggered as the document is created.
        * User can add a dictionnary of metadata as they created a document. This dictionnary must be a compliant JSON schema and is limited to (TODO) ko.
        * __v1:__
          * The description field in body request must be present
          * The document is created in Pièces, hence also returning a `legacyId` (aka code pièce).
          * Legacy means legacy. Don't get use to it!
          * Insured's first and last name are not available.
          * User defined dictionnary of metadata is not available
          * Limitation in v1, creation groups and transmission groups are equivalent to the legacy 'lot sortant', therefore when adding an output document to an existing 'lot sortant', you must specify the document group UUID of the first output document and also you can only create transmissions that contain exactly the same documents of the 'lot sortant'.
          * Legacy output document are created in the status 'Lot en cours de création'.
          * You can create creation group using DMS or using piece-web-metier, but not partly using DMS, and the other part using piece-webmetier.
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderFeatureFlag_Create"
        - $ref: "#/components/parameters/HeaderImpersonateApp"
        - $ref: "#/components/parameters/RequiredHeaderUserProfile"
        - $ref: "#/components/parameters/RequiredHeaderUserAgent"
        - $ref: "#/components/parameters/RequiredHeaderLanguage"
      requestBody:
        $ref: "#/components/requestBodies/OutputDocumentCreationRequestBodyWithCharset"
      responses:
        "201":
          $ref: "#/components/responses/OutputDocumentCreationCreatedResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        default:
          $ref: "#/components/responses/UnexpectedErrorResponse"

    # GET /private/secure/output/documents
    get:
      tags:
        - Output Document - Core
      summary: "Listing output documents"
      description: |
        * Gets the list of output documents that match filters. Documents without an active content or with an archiving state = DESTROYED are never returned.
        * By default the service should not return any subresource. If you want to retrieve them, specify the `extension` query param (e.g. `extension=transmissions`).
        * Paging:
          * The service takes three query parameters to handle paging:
            * limit: the maximum number of element to retrieve
            * offset: the index of the first element to be retrieved
            * totalCount: true if the total count of elements that can be retrieved shall be returned
          * The service returns a `_links` node with links to:
            * the `first` element
            * the `previous` element (if there is one)
            * the `next` element (if there is one)
          * The service returns a `totalCount` element if the associated query param is true.
            * the `last` element (if `totalCount = true` ; strongly discouraged for performance issue)
        * Sorting:
          * The service is only available in v2
          * One parameter per row needs to be entered with the following format :
            parameterName asc : to sort by ascending order
            parameterName desc : to sort by descending order
          * Here is the mapping between the sort parameter names and the fields in the database

            | Parameter name     | Database schema              | Database table   | Database field               |
            | ------------------ | ---------------------------- | ---------------- | ---------------------------- |
            | createdAt          | document_management_services |  output_document | created_at                   |
            | reference          | document_management_services |  output_document | indexation_reference         |
            | modifiedAt         | document_management_services |  output_document | modified_at                  |
            | insuredFirstName   | document_management_services |  output_document | indexation_insured_firstname |
            | insuredLastName    | document_management_services |  output_document | indexation_insured_lastname  |
            | modifiedByUserUuid | document_management_services |  output_document | modified_by_user_profile     |
            | description        | document_management_services |  output_document | description                  |
            | emailRecipientTo   | document_management_services |  transmission    | email_recipient_to           |

            The following parameters are translated labels in the 'message' column of the 'document_management_services_referential.message_bundle' table.
            The ids of the translations are stored in the following columns:

            | Parameter name     |  id value column                                                         |
            | -----------------  | ------------------------------------------------------------------------ |
            | activityId         | document_management_services.output_document.indexation_activity_id      |
            | domainId           | document_management_services.output_document.indexation_domain_id        |
            | insurerId          | document_management_services.output_document.indexation_insurer_id       |
            | distributorId      | document_management_services.output_document.indexation_distributor_id   |
            | natureId           | document_management_services.output_document.indexation_nature_id        |
            | subsidiaryId       | document_management_services.output_document.indexation_subsidiary_id    |

        * __v1:__
          * Some filters are not available in v1 because non existent in the legacy services:
            * `createdAt`
            * `createdByUserUuid`
            * `modifiedAt`
            * `recipientEmail`
            * `transmissionUuid`
          * Some filters are not available in v1:
            * `createdFrom` and `createdTo`
            * `modifiedFrom` and `modifiedTo`
            * `apiVersion`
            * `insurerId`
            * `distributorId`
            * `domainId` can't be a list
            * `activityId` can't be a list
            * `subsidiaryId` can't be a list
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderFeatureFlag_Read"
        - $ref: "#/components/parameters/HeaderImpersonateApp"
        - $ref: "#/components/parameters/RequiredHeaderUserProfile"
        - $ref: "#/components/parameters/RequiredHeaderUserAgent"
        - $ref: "#/components/parameters/RequiredHeaderLanguage"
        - $ref: "#/components/parameters/ContentRangeLimit"
        - $ref: "#/components/parameters/ContentRangeOffset"
        - $ref: "#/components/parameters/ContentRangeTotalCount"
        #- $ref: '#/components/parameters/ContentRangeOrder'
        - $ref: "#/components/parameters/SortByFieldList"
        - $ref: "#/components/parameters/OutputDocumentExtensionList"
        - $ref: "#/components/parameters/DocumentUuidList"
        - $ref: "#/components/parameters/DomainIdList"
        - $ref: "#/components/parameters/ActivityIdList"
        - $ref: "#/components/parameters/DistributorIdList"
        - $ref: "#/components/parameters/DistributorInternalCodeList"
        - $ref: "#/components/parameters/DistributorGroupIdList"
        - $ref: "#/components/parameters/InsurerIdList"
        - $ref: "#/components/parameters/NatureIdList"
        - $ref: "#/components/parameters/CreatedFrom"
        - $ref: "#/components/parameters/CreatedTo"
        - $ref: "#/components/parameters/ModifiedFrom"
        - $ref: "#/components/parameters/ModifiedTo"
        - $ref: "#/components/parameters/ModifiedByUserUuid"
        - $ref: "#/components/parameters/Reference"
        - $ref: "#/components/parameters/InsuredFirstName"
        - $ref: "#/components/parameters/InsuredLastName"
        - $ref: "#/components/parameters/SubsidiaryIdList"
        - $ref: "#/components/parameters/TransmissionUuidList"
        - $ref: "#/components/parameters/TransmissionTypeIdList"
        - $ref: "#/components/parameters/DeliveryStateIdList"
        - $ref: "#/components/parameters/PrintingMode"
        - $ref: "#/components/parameters/PrintingLocation"
        - $ref: "#/components/parameters/RecipientEmail"
        - $ref: "#/components/parameters/ApiVersion"
      responses:
        "200":
          $ref: "#/components/responses/OutputDocumentListOKResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        default:
          $ref: "#/components/responses/UnexpectedErrorResponse"

