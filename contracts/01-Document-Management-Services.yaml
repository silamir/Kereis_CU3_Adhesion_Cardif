  ############################################################
  "/private/secure/input/documents/{documentUuid}/close":
    ############################################################

    # POST /private/secure/input/documents/{documentUuid}/close
    post:
      tags:
        - Input Document - Processing
      summary: "Closing an input document"
      description: |
        * This service closes an input document:
          * The processing status is changed to the closingReason requested {`MANIPULATED`|`ARCHIVED`|`PROCESSED`|`DISCARDED`|`REJECTED`}, if the processing status of the input document to close has not already been closed with the same closingReason {`MANIPULATED`, `ARCHIVED`, `PROCESSED`, `DISCARDED`, `REJECTED`}.
        * A `DOCUMENT_CLOSED` event is triggered as the document is closed.
        * __v1:__
          * Depending whether the document is bound, the status of the document in the legacy system is set to `Attaché` or `Manuel`.
          * As a bind in DMS does a partial attachment in Pièces, when a document in closed in DMS, if there is a binding on this document, the corresponding document in the legacy system is finally attached.
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderFeatureFlag_Update"
        - $ref: "#/components/parameters/HeaderImpersonateApp"
        - $ref: "#/components/parameters/RequiredHeaderUserProfile"
        - $ref: "#/components/parameters/RequiredHeaderUserAgent"
        - $ref: "#/components/parameters/RequiredHeaderLanguage"
        - $ref: "#/components/parameters/RequiredPathDocumentUuid"
        - $ref: "#/components/parameters/RequiredClosingReason"
      responses:
        "204":
          description: "Document is closed."
          headers:
            Location:
              $ref: "#/components/headers/GetDocumentUrl"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "409":
          $ref: "#/components/responses/ConflictResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        default:
          $ref: "#/components/responses/UnexpectedErrorResponse"

  ############################################################
  "/private/secure/input/documents/{documentUuid}/reopen":
    ############################################################

    # POST /private/secure/input/documents/{documentUuid}/reopen
    post:
      tags:
        - Input Document - Processing
      summary: "Reopening a closed input document"
      description: |
        * This service reopens a closed input document, except ARCHIVED which is the state for documents never processed by operators :
          * The processing status is changed to 'PENDING_PROCESSING' (or the target processing state - if given - for V2).
        * A `DOCUMENT_REOPENED` event is triggered as the document is reopened.
        * __v1:__
          * 'Restauration' event is triggered to legacy and the document are moved to 'en cours' with state 'En attente exploitation'
          * The document must be 'historisé' (closed) otherwise 403

      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderFeatureFlag_Update"
        - $ref: "#/components/parameters/HeaderImpersonateApp"
        - $ref: "#/components/parameters/RequiredHeaderUserProfile"
        - $ref: "#/components/parameters/RequiredHeaderUserAgent"
        - $ref: "#/components/parameters/RequiredHeaderLanguage"
        - $ref: "#/components/parameters/RequiredPathDocumentUuid"
        - $ref: "#/components/parameters/TargetProcessingStateNotClosed"
        - $ref: "#/components/parameters/Lock"
        - $ref: "#/components/parameters/TimeOut"
      responses:
        "204":
          description: "Document is reopened."
          headers:
            Location:
              $ref: "#/components/headers/GetDocumentUrl"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "409":
          $ref: "#/components/responses/ConflictResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        default:
          $ref: "#/components/responses/UnexpectedErrorResponse"

  #
  # INPUT DOCUMENT - BINDING
  #

  ############################################################
  "/private/secure/input/documents/{documentUuid}/bind":
    ############################################################

    # POST /private/secure/input/documents/{documentUuid}/bind
    post:
      tags:
        - Input Document - Binding
      summary: "Binding an input document to a case and an application"
      description: |
        * This service binds an input document to a case (subscription, claim) and an application.
        * The processing status of the document shall be `PENDING_PROCESSING` or closed i.e {`MANIPULATED`|`ARCHIVED`|`PROCESSED`|`DISCARDED`|`REJECTED`}.
        * Client application may update the dictionnary of custom metadata that they may have set at the creation.
        * As soon as the document is bound, the archive status is set to `DECLARED`, and therefore the document is read only.
        * Because the archiving status changes to `DECLARED`, some indexation properties might be enforced to ensure data quality.
        * After binding the document, the client application becomes the owner of the document and it is from the responsability of the client application to handle the archiving life cycle of it.
        * A `DOCUMENT_BOUND` event is triggered as the document is bound.
        * If the original document is already `Closed`, the `close` parameter is ignored.

        | clone | close | original document                           | cloned document                                  |
        | ----- | ----- | ------------------------------------------- | ------------------------------------------------ |
        | false | false | bound without changing its processing state | N/A                                              |
        | false |  true | bound with processing state set to Closed   | N/A                                              |
        |  true | false | no update                                   | bound with same processing state as the original |
        |  true |  true | processing state set to Closed              | bound with processing state set to Closed        |

        * __v1:__
          * close=false&clone=false isn't allowed, the response will always be 501 (Not Implemented).

          | clone | close | original document                           | cloned document                                  |
          | ----- | ----- | ------------------------------------------- | ------------------------------------------------ |
          | false | false | N/A                                         | N/A                                              |
          | false |  true | "Attachement définitif"                     | N/A                                              |
          |  true | false | "En attente d'exploitation"                 | "Attachement définitif"                          |
          |  true |  true | "Archivé"                                   | "Attachement définitif"                          |

          * Cloning duplicates the 'pièce' in the legacy system duplicates its content.
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderFeatureFlag_Update"
        - $ref: "#/components/parameters/HeaderImpersonateApp"
        - $ref: "#/components/parameters/RequiredHeaderUserProfile"
        - $ref: "#/components/parameters/RequiredHeaderUserAgent"
        - $ref: "#/components/parameters/RequiredHeaderLanguage"
        - $ref: "#/components/parameters/RequiredPathDocumentUuid"
        - name: clone
          in: query
          description: "If true, clone the input document before binding with the processing state set to `Closed`"
          schema:
            type: boolean
        - name: close
          in: query
          description: "If true, closes the original input document."
          schema:
            type: boolean
            default: false
      requestBody:
        $ref: "#/components/requestBodies/InputDocumentBindRequestBody"
      responses:
        "201":
          $ref: "#/components/responses/InputDocumentBindingCreatedResponse"
        "204":
          $ref: "#/components/responses/InputDocumentBindingNoContentResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "409":
          $ref: "#/components/responses/ConflictResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        "501":
          $ref: "#/components/responses/NotImplementedResponse"
        default:
          $ref: "#/components/responses/UnexpectedErrorResponse"

  ############################################################
  "/private/secure/input/documents/{documentUuid}/unbind":
    ############################################################

    # POST /private/secure/input/documents/{documentUuid}/unbind
    post:
      tags:
        - Input Document - Binding
      summary: "Unbinding an input document from a case and an application"
      description: |
        * This service unbinds an input document from a case (subscription, claim) and an application.
        * Only a document in the archiving state `DECLARED` can be unbound.
        * The archiving state of the document changes from `DECLARED` to `CURRENT`.
        * The document can be reopened so that it appears in the appropriate inbox.
        * A `DOCUMENT_UNBOUND` event is triggered as the document is unbound.
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderFeatureFlag_Update"
        - $ref: "#/components/parameters/HeaderImpersonateApp"
        - $ref: "#/components/parameters/RequiredHeaderUserProfile"
        - $ref: "#/components/parameters/RequiredHeaderUserAgent"
        - $ref: "#/components/parameters/RequiredHeaderLanguage"
        - $ref: "#/components/parameters/RequiredPathDocumentUuid"
        - name: reopen
          in: query
          description: "If true, reopens the input document"
          schema:
            type: boolean
            default: false
      responses:
        "204":
          description: "Input document is unbound."
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "409":
          $ref: "#/components/responses/ConflictResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        default:
          $ref: "#/components/responses/UnexpectedErrorResponse"

  #
  # INPUT DOCUMENT - MANIPULATION
  #

  ############################################################
  "/private/secure/input/documents/{documentUuid}/content/extract":
    ############################################################

    # POST /private/secure/input/documents/{documentUuid}/content/extract
    post:
      tags:
        - Input Document - Content Manipulation
      summary: "Extraction of content of an input document"
      description: |
        * This service extracts the content of an input document into several input documents with the original document's metadata.
        * the `pageSelection` query param indicates the pages that should be extracted (`allpages` or some printing-like page selection).
        * Each new created document (`target`) is associated to the original document (`source`) with a `EXTRACTION` relationship.
        * A `DOCUMENT_EXTRACTED_TO` event is triggered for the original document and a `DOCUMENT_EXTRACTED_FROM` event is triggered for the extracted documents.
        * __v1:__
          * Extraction of the `documentUuid`/`legacyId` using a pattern of split (`pageSelection`).
          * The `legacyId` document is duplicated in the legacy system => new document `legacyId2`.
          * DMS calls the legacy split service on `legacyId2`.
            * `legacyId2` becomes the first part of the extraction and new legacy document are created for the next parts.
            * New input documents are created in DMS for all these legacy documents.
          * The legacy TIF split service doesn't allow to use a page selection pattern: `allpages` only.
          * The legacy TIF split service doesn't ensure that the created documents will be ordered as they were ordered in the original document.
          * Relationships are saves in database from v1.
          * Extracting a document in the `Ready` processing state creates new documents in the `PendingProcessing` processing state and not `Ready` processing state.
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderFeatureFlag_Create"
        - $ref: "#/components/parameters/HeaderImpersonateApp"
        - $ref: "#/components/parameters/RequiredHeaderUserProfile"
        - $ref: "#/components/parameters/RequiredHeaderUserAgent"
        - $ref: "#/components/parameters/RequiredHeaderLanguage"
        - $ref: "#/components/parameters/RequiredPathDocumentUuid"
        - $ref: "#/components/parameters/RequiredPageSelection"
        - $ref: "#/components/parameters/Lock"
        - $ref: "#/components/parameters/TimeOut"
        - name: close
          in: query
          description: |
            If true, closes the original input document.  
            The original document closed by extraction is changed to the processingState `MANIPULATED`, with the closingReason for the document event `MANIPULATED`.
          schema:
            type: boolean
            default: false
      responses:
        "201":
          $ref: "#/components/responses/InputDocumentExtractionCreatedResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        default:
          $ref: "#/components/responses/UnexpectedErrorResponse"

  ############################################################
  "/private/secure/input/documents/content/merge":
    ############################################################

    # GET /private/secure/input/documents/content/merge
    get:
      tags:
        - Input Document - Content Manipulation
      summary: "Merging content of several input PDF and Tiff documents into one PDF file"
      description: |
        * This service retrieves the merge content of several input documents.
        * no actions on document metadata
        * Only PDF, Tiff, HTML/XHTML and TXT files supported
        * PDF output file
        * DMS v2 only
        * No new document is created
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderFeatureFlag_Read"
        - $ref: "#/components/parameters/HeaderImpersonateApp"
        - $ref: "#/components/parameters/RequiredHeaderUserProfile"
        - $ref: "#/components/parameters/RequiredHeaderUserAgent"
        - $ref: "#/components/parameters/RequiredHeaderLanguage"
        - $ref: "#/components/parameters/RequiredDocumentUuidList"
      responses:
        "200":
          $ref: "#/components/responses/InputDocumentDownloadContentOKResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        "501":
          $ref: "#/components/responses/NotImplementedResponse"
        default:
          $ref: "#/components/responses/UnexpectedErrorResponse"

    # POST /private/secure/input/documents/content/merge
    post:
      tags:
        - Input Document - Content Manipulation
      summary: "Merging the metadata and content of several input documents"
      description: |
        * This service merges the metadata and content of several input documents into a new input document.
        * Each original document (`source`) is associated to the new document (`target`) with a `MERGING` relationship.
        * A `DOCUMENT_CONTENT_MERGED_TO` event is triggered for the original documents and a `DOCUMENT_CONTENT_MERGED_FROM` event is triggered for the merged document.
        * __v1:__
          * Merging of two (or more) documents `documentUuid1`/`legacyId1` and `documentUuid2`/`legacyId2`
          * The `legacyId1` document is duplicated in the legacy system => new document `legacyId3`.
          * DMS calls the legacy merge service on `legacyId3` and `legacyId2`.
            * `legacyId3` becomes the merged document.
            * New input document is created in DMS for this legacy document.
          * Relationships are saves in database from v1.
          * Merging documents in the `Ready` processing state creates a new document in the `PendingProcessing` processing state and not `Ready` processing state.
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderFeatureFlag_Create"
        - $ref: "#/components/parameters/HeaderImpersonateApp"
        - $ref: "#/components/parameters/RequiredHeaderUserProfile"
        - $ref: "#/components/parameters/RequiredHeaderUserAgent"
        - $ref: "#/components/parameters/RequiredHeaderLanguage"
        - $ref: "#/components/parameters/RequiredDocumentUuidList"
        - $ref: "#/components/parameters/Lock"
        - $ref: "#/components/parameters/TimeOut"
        - name: close
          in: query
          description: |
            If true, closes the original input document.  
            The original documents closed by a merge move to the processingState `MANIPULATED` with the closingReason for the document event `MANIPULATED`.
          schema:
            type: boolean
            default: false
      responses:
        "201":
          $ref: "#/components/responses/InputDocumentMergeCreatedResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        "501":
          $ref: "#/components/responses/NotImplementedResponse"
        default:
          $ref: "#/components/responses/UnexpectedErrorResponse"

