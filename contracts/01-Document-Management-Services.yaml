              description: "Type of scanning identifier (2 letters)."
            name:
              type: string
              description: "Type of scanning name."

    InputCustomerUploadProperties:
      type: object
      description: "Specific customer upload properties."

    ReceptionType:
      type: object
      required:
        - name
