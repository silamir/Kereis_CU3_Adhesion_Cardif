  ############################################################
  "/private/secure/input/documents/{documentUuid}":
    ############################################################

    # GET /private/secure/input/documents/{documentUuid}
    get:
      tags:
        - Input Document - Core
      summary: "Getting an input document"
      description: |
        * This service gets metadata of an input document.
        * By default the service should not return any subresource. If you want to retrieve them, specify the `extension` query param (e.g. `extension=reception`).
        * __v1:__
          * `documentUuid` can be a `legacyId`.
          * reception information are not fully filled as the concept is new in DMS, please test the service to be sure the field you intend to use exists in v1.
            * the creation and modification audit dates are null.
            * the reception group is null.
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderFeatureFlag_Read"
        - $ref: "#/components/parameters/HeaderImpersonateApp"
        - $ref: "#/components/parameters/RequiredHeaderUserProfile"
        - $ref: "#/components/parameters/RequiredHeaderUserAgent"
        - $ref: "#/components/parameters/RequiredHeaderLanguage"
        - $ref: "#/components/parameters/RequiredPathDocumentUuid"
        - $ref: "#/components/parameters/InputDocumentExtensionList"
      responses:
        "200":
          $ref: "#/components/responses/InputDocumentGetOKResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "410":
          $ref: "#/components/responses/GoneResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        default:
          $ref: "#/components/responses/UnexpectedErrorResponse"

    # PUT /private/secure/input/documents/{documentUuid}
    put:
      tags:
        - Input Document - Core
      summary: "Updating an input document"
      description: |
        * This service can be used to update the metadata of a document.
        * When properties are updated, a new version of them is created.
        * Update is forbidden if the archive status is not `CURRENT`.
        * A `DOCUMENT_UPDATED` event is triggered as the document is updated.
        * __v1:__
          * No versioning, data is updated in the legacy system.
          * Impossible to update some fields as the legacy service does not exist, here is the list of the legacy fields that can be updated:
            - activite
            - dossier
            - famille
            - groupe
            - codeBanque
            - natureDocument
            - commentaire
            - codeAgence
            - codeCompagnie
            - typeReception
            - description
            - nom
            - prénom
          * Impossible to update legacy document in the state Invalide or Renvoyé
          * Impossible to update the metadata and set the processing state to `PENDING_INDEXATION`
        * __v2:__
          * Put is not a Patch. So you'll have to put the entire metadata to avoid clearing fields
          * Carefull : Description field in body request must be present regarding to v1
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderFeatureFlag_Update"
