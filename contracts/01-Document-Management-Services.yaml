  /private/secure/cdc/errors:
    delete:
      tags:
        - CDC Manager Resource
      summary: Delete all error topic messages
      operationId: deleteErrorsTopicContent
      parameters:
        - name: topic
          in: query
          description: The error topic to cleanup
          required: true
          schema:
            type: string
      responses:
        204:
          description: Error topic content is deleted
        400:
          description: The parameter is not an error topic
    parameters:
      - $ref: "#/components/parameters/HeaderClientRequestId"
      - $ref: "#/components/parameters/RequiredHeaderUserProfile"
      - $ref: "#/components/parameters/RequiredHeaderUserAgent"
  /private/secure/cdc/errors/republish:
    post:
      tags:
        - CDC Manager Resource
      summary:
        "Republish all errors message in initial topic : warn - all producers
        should be paused to republish error messages"
      operationId: republishErrorsTopicContent
      parameters:
        - name: topic
          in: query
          description: The error topic to republish
          required: true
          schema:
            type: string
        - name: shardSize
          in: query
          description: The shard size for the publication on the target topic (default 1000)
          schema:
            type: number
      responses:
        204:
          description: All messages are republished
        400:
          description: The parameter is not an error topic
    parameters:
      - $ref: "#/components/parameters/HeaderClientRequestId"
      - $ref: "#/components/parameters/RequiredHeaderUserProfile"
      - $ref: "#/components/parameters/RequiredHeaderUserAgent"
  #
  # ADMINISTRATION
  #
  ############################################################
  "/private/secure/caches":
    ############################################################

    # DELETE /private/secure/caches
    delete:
      tags:
        - Administration
      summary: "Clearing cache"
      description: |
        * This service clears the cache of reference data.
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderFeatureFlag"
        - $ref: "#/components/parameters/HeaderImpersonateApp"
        - $ref: "#/components/parameters/RequiredHeaderUserProfile"
        - $ref: "#/components/parameters/RequiredHeaderUserAgent"
        - name: cacheSpring
          in: query
          description: "List of Spring cache names (e.g. cache-referentiel, ALL to clear everything, no value will clear nothing)."
          schema:
            type: array
            items:
              type: string
              example: "cache-referentiel"
        - name: cacheHibernate
          in: query
          description: "List of second level Hibernate cache names (e.g. com.cbp.csp.model.legacy.entities.IdentifierMapping, ALL to clear everything, no value will clear nothing)"
          schema:
            type: array
            items:
              type: string
              example: "com.cbp.csp.model.legacy.entities.IdentifierMapping"
      responses:
        "204":
          description: "Cache has been cleared."
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        default:
          $ref: "#/components/responses/UnexpectedErrorResponse"

  #
  # APPLICATION
  #

  ############################################################
  "/private/secure/applications":
    ############################################################

    # POST /private/secure/applications
    post:
      tags:
        - Application
      summary: "Creating a client application configuration"
      description: |
        * This service creates or updates a client application configuration.
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderFeatureFlag"
        - $ref: "#/components/parameters/HeaderImpersonateApp"
        - $ref: "#/components/parameters/RequiredHeaderUserProfile"
        - $ref: "#/components/parameters/RequiredHeaderUserAgent"
      requestBody:
        $ref: "#/components/requestBodies/ApplicationCreationRequestBody"
      responses:
        "201":
          $ref: "#/components/responses/ApplicationCreationCreatedResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        default:
          $ref: "#/components/responses/UnexpectedErrorResponse"

    # GET /private/secure/applications
    get:
      tags:
        - Application
      summary: "Listing all client applications"
      description: |
        * This service lists all client application configurations.
        * Paging:
          * The service takes three query parameters to handle paging:
            * limit: the maximum number of element to retrieve
            * offset: the index of the first element to be retrieved
            * totalCount: true if the total count of elements that can be retrieved shall be returned
          * The service returns a `_links` node with links to:
            * the `first` element
            * the `previous` element (if there is one)
            * the `next` element (if there is one)
          * The service returns a `totalCount` element if the associated query param is true.
            * the `last` element (if `totalCount = true` ; strongly discouraged for performance issue)
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderFeatureFlag"
        - $ref: "#/components/parameters/HeaderImpersonateApp"
        - $ref: "#/components/parameters/RequiredHeaderUserProfile"
