  ############################################################
  "/private/secure/input/documents/{documentUuid}/content":
    ############################################################

    # GET /private/secure/input/documents/{documentUuid}/content
    get:
      tags:
        - Input Document - Content
      summary: "Getting input document content"
      description: |
        * This service returns an URL to download the more recent active version of the content (the one indicated by the more recent version of the properties).
        * /!\ Swagger doesn't handle the redirection (TypeError: Failed to fetch)
        * __v1:__
          * No versioning handled.
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderFeatureFlag_Read"
        - $ref: "#/components/parameters/HeaderImpersonateApp"
        - $ref: "#/components/parameters/RequiredHeaderUserProfile"
        - $ref: "#/components/parameters/RequiredHeaderUserAgent"
        - $ref: "#/components/parameters/RequiredHeaderLanguage"
        - $ref: "#/components/parameters/RequiredPathDocumentUuid"
        - $ref: "#/components/parameters/TargetMimeType"
      responses:
        "307":
          $ref: "#/components/responses/InputDocumentContentGetNoContentResponse"
        "304":
          $ref: "#/components/responses/InputDocumentContentGetNoContentResponseNotModified"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        default:
          $ref: "#/components/responses/UnexpectedErrorResponse"

    # PUT /private/secure/input/documents/{documentUuid}/content
    put:
      tags:
        - Input Document - Content
      summary: "Updating the input document content"
      description: |
        * This service returns an URL in the location response header a dictionnary of form fields in the response body to be used to upload a new version of content.
        * The upload URL is a temporary pre-signed S3 URL.
        * This upload URL must be used along with the form fields provided in the response.
        * Until the content is fully processed (from `PendingContentUpload` to `Available), the active version of the content remains the current one.
        * When the new version of the content is available, a new version of the properties is created pointing to the new version of the content.
        * A `DOCUMENT_CONTENT_UPDATED` event is triggered as the content of the document is updated (when the new version of the document is active, therefore after the content has been successfuly uploaded).
        * Some detailed event are triggered along the processing of the content:
          * `DOCUMENT_CONTENT_UPLOAD_ABORTED`
          * `DOCUMENT_CONTENT_UPLOAD_SUCCEEDED`
          * `DOCUMENT_CONTENT_QUARANTINED`
          * `DOCUMENT_CONTENT_VIRUS_SAFE`
          * `DOCUMENT_CONTENT_CONVERSION_FAILED`
          * `DOCUMENT_CONTENT_CONVERSION_SUCCEEDED`
        * __v1:__
          * The form fields are limited to one field: uploadUuid, but make sure your integration of the service can handle any form fields.
      requestBody:
        $ref: "#/components/requestBodies/InputDocumentContentUpdateRequestBody"
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderFeatureFlag_Update"
        - $ref: "#/components/parameters/HeaderImpersonateApp"
        - $ref: "#/components/parameters/RequiredHeaderUserProfile"
        - $ref: "#/components/parameters/RequiredHeaderUserAgent"
        - $ref: "#/components/parameters/RequiredHeaderLanguage"
        - $ref: "#/components/parameters/RequiredPathDocumentUuid"
      responses:
        "200":
          $ref: "#/components/responses/InputDocumentContentUpdateOKResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "409":
          $ref: "#/components/responses/ConflictResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        default:
          $ref: "#/components/responses/UnexpectedErrorResponse"

  ############################################################
  "/private/secure/input/documents/{documentUuid}/content/download":
    ############################################################

    # GET /private/secure/input/documents/{documentUuid}/content/download
    get:
      tags:
        - Input Document - Content
      summary: "Downloading the content of an input document"
      description: |
        * This service ensures the download of a document's content.
        * This service should only be called as following a redirection retrieved via the GET /private/secure/input/documents/{documentUuid}/content.
        * __v1:__
          * This services takes a unique query parameter, a UUID, that is provided when calling the GET /private/secure/input/documents/{documentUuid}/content service.
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderFeatureFlag_Read"
        - $ref: "#/components/parameters/HeaderImpersonateApp"
        - $ref: "#/components/parameters/RequiredHeaderUserProfile"
        - $ref: "#/components/parameters/RequiredHeaderUserAgent"
        - $ref: "#/components/parameters/RequiredHeaderLanguage"
        - $ref: "#/components/parameters/RequiredPathDocumentUuid"
        - $ref: "#/components/parameters/TargetMimeType"
        - name: securityToken
          in: query
          description: "A short term lived token provided with the URL from the GET /private/secure/input/documents/{documentUuid}/content."
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/InputDocumentDownloadContentOKResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "409":
          $ref: "#/components/responses/ConflictResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        default:
          $ref: "#/components/responses/UnexpectedErrorResponse"

  ############################################################
  "/private/secure/input/documents/{documentUuid}/content/upload":
    ############################################################

    # PUT /private/secure/input/documents/{documentUuid}/content/upload
    put:
      tags:
        - Input Document - Content
      summary: "Uploading input document content"
      description: |
        * This service ensures the upload of a document's content.
        * This service should never be called outside the scope of uploading a document after a document creation or content modification request.
        * It acts as a proxy to a legacy service and mimic the target AWS S3 service that will be used to directly upload content to a S3 bucket.
        * __v1:__
          * This services takes a unique form field parameter, a UUID, that is provided when calling the PUT /private/secure/input/documents/{documentUuid}/content service.
          * Starting v1, you must ensure that you call this service with all the form fields returned in the previously mentionned service. If you do not, you won't be able to update content in some next release.
      requestBody:
        $ref: "#/components/requestBodies/InputDocumentUploadContentRequestBody"
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderFeatureFlag_Update"
        - $ref: "#/components/parameters/HeaderImpersonateApp"
        - $ref: "#/components/parameters/RequiredHeaderUserProfile"
        - $ref: "#/components/parameters/RequiredHeaderUserAgent"
        - $ref: "#/components/parameters/RequiredHeaderLanguage"
        - $ref: "#/components/parameters/RequiredPathDocumentUuid"
        - name: securityToken
          in: query
          description: "A short term lived token provided with the URL from the PUT /private/secure/input/documents/{documentUuid}/content."
          schema:
            type: string
      responses:
        "204":
          $ref: "#/components/responses/InputDocumentUpdateContentNoContentResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "409":
          $ref: "#/components/responses/ConflictResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        default:
          $ref: "#/components/responses/UnexpectedErrorResponse"

  ############################################################
  "/private/secure/input/documents/{documentUuid}/content/move":
    ############################################################

    # POST /private/secure/input/documents/{documentUuid}/content/move
    post:
      tags:
        - Input Document - Content
      summary: "Moving a document from DFS to S3 or from S3 to DFS"
      description: |
        * This service ensures the transfer of a document from the legacy platform storage (DFS) to the AWS  object storage (S3), or its rollback.
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderFeatureFlag_Update"
        - $ref: "#/components/parameters/HeaderImpersonateApp"
        - $ref: "#/components/parameters/RequiredHeaderUserProfile"
        - $ref: "#/components/parameters/RequiredHeaderUserAgent"
        - $ref: "#/components/parameters/RequiredHeaderLanguage"
        - $ref: "#/components/parameters/RequiredPathDocumentUuid"
        - name: target
          in: query
          description: "The target destination of the transfer (S3 or DFS)."
          required: true
          schema:
            type: string
            enum: ["S3", "DFS"]
      responses:
        "204":
          $ref: "#/components/responses/InputDocumentMoveContentNoContentResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "409":
          $ref: "#/components/responses/ConflictResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        default:
          $ref: "#/components/responses/UnexpectedErrorResponse"

  ############################################################
  "/private/secure/input/documents/{documentUuid}/content/annotations":
    ############################################################

    # GET /private/secure/input/documents/{documentUuid}/content/annotations
    get:
      tags:
        - Input Document - Content
      summary: "Getting document annotations (xfdf format)"
      description: |
        * Use to retrieve PDF document annotations in xfdf format initialiy afflix by the viewer.
        * return empty xml description structure if no annotation found
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderFeatureFlag_Read"
        - $ref: "#/components/parameters/HeaderImpersonateApp"
        - $ref: "#/components/parameters/RequiredHeaderUserProfile"
        - $ref: "#/components/parameters/RequiredHeaderUserAgent"
        - $ref: "#/components/parameters/RequiredHeaderLanguage"
        - $ref: "#/components/parameters/RequiredPathDocumentUuid"
