        - $ref: "#/components/schemas/InputBackOfficeProperties"

    InputContactCenterReceptionTypeCreateBody:
      type: object
      allOf:
        - $ref: "#/components/schemas/ReceptionTypeId"
        - $ref: "#/components/schemas/InputContactCenterProperties"

    InputEdiReceptionTypeCreateBody:
      type: object
      allOf:
        - $ref: "#/components/schemas/ReceptionTypeId"
        - $ref: "#/components/schemas/InputEdiProperties"

    InputEmailReceptionTypeCreateBody:
