            group:
              $ref: "#/components/schemas/GroupId"
            insured:
              $ref: "#/components/schemas/Insured"
            insurer:
              $ref: "#/components/schemas/InsurerId"
            original:
              type: boolean
              description: "Document is an original (business speaking; e.g. a scanned signed BA)"
            #market:
            #  $ref: '#/components/schemas/MarketId'
            nature:
              $ref: "#/components/schemas/NatureId"
            reference:
              $ref: "#/components/schemas/Reference"
            subsidiary:
              $ref: "#/components/schemas/SubsidiaryId"
            warranty:
              $ref: "#/components/schemas/WarrantyId"
        metadata:
          type: object
          description: "Client metadata."

    # Input Document - Manipulation Schemas

