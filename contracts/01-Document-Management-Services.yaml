        boundAt:
          type: string
          format: date-time
          description: "Date and time of the binding."
        boundByApp:
          $ref: "#/components/schemas/App"
        boundByUser:
          $ref: "#/components/schemas/User"
        reference:
          type: string

    NullableDocumentBinding:
      type: object
