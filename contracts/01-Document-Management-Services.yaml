            name:
              type: string
            nature:
              type: object
              properties:
                id:
                  type: integer
                name:
                  type: string
            type:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
            url:
              type: string
        transmissions:
          type: array
