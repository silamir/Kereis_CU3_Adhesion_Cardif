  ############################################################
  "/private/secure/output/documents/{documentUuid}/undeclare":
    ############################################################

    # POST /private/secure/output/documents/{documentUuid}/undeclare
    post:
      tags:
        - Output Document - Archiving
      summary: "Undeclaring an output document from being a record (unarchive)"
      description: |
        * Changes the archiving status of the document to `CURRENT`.
        * A `DOCUMENT_UNDECLARED` event is triggered as the document is undeclared.
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderFeatureFlag_Update"
        - $ref: "#/components/parameters/HeaderImpersonateApp"
        - $ref: "#/components/parameters/RequiredHeaderUserProfile"
        - $ref: "#/components/parameters/RequiredHeaderUserAgent"
        - $ref: "#/components/parameters/RequiredHeaderLanguage"
        - $ref: "#/components/parameters/RequiredPathDocumentUuid"
      responses:
        "204":
          description: "The document has been undeclared."
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        default:
          $ref: "#/components/responses/UnexpectedErrorResponse"

  ############################################################
  "/private/secure/output/documents/{documentUuid}/cutoff":
    ############################################################

    # POST /private/secure/output/documents/{documentUuid}/cutoff
    post:
      tags:
        - Output Document - Archiving
      summary: "Cutting off an output document"
      description: |
        * This service records the cut off request of the document with a retention period after which the document will be destroyed.
        * The archiving status of the document is changed to `RESTRICTED`.
        * From this state, the document access is restricted to archivist profiles.
        * The retention period determines when the document will be destroyed. (NOT IMPLEMENTED!)
        * It's forbidden to cut off a document that is part of a non sent nor canceled transmission.
        * A `DOCUMENT_CUTOFF` event is triggered as the document is cut off.
        * v1:
          * The legacy service to cut off a document is called, but the new archiving state is not currently retrieved (`Restricted`).
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderFeatureFlag_Update"
        - $ref: "#/components/parameters/HeaderImpersonateApp"
        - $ref: "#/components/parameters/RequiredHeaderUserProfile"
        - $ref: "#/components/parameters/RequiredHeaderUserAgent"
        - $ref: "#/components/parameters/RequiredHeaderLanguage"
        - $ref: "#/components/parameters/RequiredPathDocumentUuid"
        - $ref: "#/components/parameters/RetentionPeriod"
      requestBody:
        $ref: "#/components/requestBodies/OutputDocumentCutoffRequestBody"
      responses:
        "204":
          description: "The document has been cut off."
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        default:
          $ref: "#/components/responses/UnexpectedErrorResponse"

  ############################################################
  "/private/secure/output/documents/{documentUuid}/uncutoff":
    ############################################################

    # POST /private/secure/output/documents/{documentUuid}/uncutoff
    post:
      tags:
        - Output Document - Archiving
      summary: "Uncutting off an output document"
      description: |
        * The cut off requested by the application is canceled.
        * If there is no other pending cut off request, the archiving status is reverted to `DECLARED` and any programmed destruction related to the canceled cut off request is also canceled.
        * A `DOCUMENT_UNCUTOFF` event is triggered as the document is uncut off.
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderFeatureFlag_Update"
        - $ref: "#/components/parameters/HeaderImpersonateApp"
        - $ref: "#/components/parameters/RequiredHeaderUserProfile"
        - $ref: "#/components/parameters/RequiredHeaderUserAgent"
        - $ref: "#/components/parameters/RequiredHeaderLanguage"
        - $ref: "#/components/parameters/RequiredPathDocumentUuid"
      responses:
        "204":
          description: "Document has been uncut off."
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        default:
          $ref: "#/components/responses/UnexpectedErrorResponse"

  ############################################################
  "/private/secure/output/documents/{documentUuid}/anonymize":
    ############################################################

    # POST /private/secure/output/documents/{documentUuid}/anonymize
    post:
      tags:
        - Output Document - Archiving
      summary: "Anonymizing an output document"
      description: |
        * This service anonymizes an output document:
          * Replaces the first name and the last name of the insured with the same transformation applied in the SI;
          * Replaces the content of the document with a anonymized one (TBD: blank, number of pages?, blured?);
          * Applies these transformations to all versions of the document;
          * Replaces the recipient information in all the transmission groups. (TBD: what to do about other documents in the transmission group?).
        * It's forbidden to anonymize a document that is part of a non sent nor canceled transmission.
        * A `DOCUMENT_ANONYMIZED` event is triggered as the document is anonymized.
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderFeatureFlag_Update"
        - $ref: "#/components/parameters/HeaderImpersonateApp"
        - $ref: "#/components/parameters/RequiredHeaderUserProfile"
        - $ref: "#/components/parameters/RequiredHeaderUserAgent"
        - $ref: "#/components/parameters/RequiredHeaderLanguage"
        - $ref: "#/components/parameters/RequiredPathDocumentUuid"
      responses:
        "204":
          description: "The document has been anonymized."
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        default:
          $ref: "#/components/responses/UnexpectedErrorResponse"

  ############################################################
  "/private/secure/output/documents/{documentUuid}/destroy":
    ############################################################

    # POST /private/secure/output/documents/{documentUuid}/destroy
    post:
      tags:
        - Output Document - Archiving
      summary: "Destroying an output document"
      description: |
        * This service records the destruction request of the document.
        * The archiving status of the document is changed to `DESTROYED`, and the metadata and content will be destroyed by a later batch processing.
        * From this state, the document access is forbidden.
        * It's forbidden to destroy a document that is part of a non sent nor canceled transmission.
        * A `DOCUMENT_DESTROYED` event is triggered as the document is destroyed.
        * v1:
          * The legacy service to destroy a document is called, but the document is not immediately flagged as destroyed until it will get destroyed by the nightly batch.
      parameters:
        - $ref: "#/components/parameters/HeaderClientRequestId"
        - $ref: "#/components/parameters/HeaderFeatureFlag_Update"
        - $ref: "#/components/parameters/HeaderImpersonateApp"
        - $ref: "#/components/parameters/RequiredHeaderUserProfile"
        - $ref: "#/components/parameters/RequiredHeaderUserAgent"
        - $ref: "#/components/parameters/RequiredHeaderLanguage"
        - $ref: "#/components/parameters/RequiredPathDocumentUuid"
      requestBody:
        $ref: "#/components/requestBodies/OutputDocumentDestroyRequestBody"
      responses:
        "204":
          description: "The document has been destroyed."
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        default:
          $ref: "#/components/responses/UnexpectedErrorResponse"

