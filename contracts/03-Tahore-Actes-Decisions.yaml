openapi: 3.0.1
info:
  title: API Tahore — Actes et decisions d'adhesion
  description: Prise de décision et gestion des actes d'une adhésion.
  contact:
    name: Support
    email: prev-support@kereis.com
  license:
    name: CC-BY-NC-ND
  version: '1.0'
  x-titre-origine: API
servers:
- url: http://localhost:8082/tahore
paths:
  /private/open/api/adhesions/{adhesionId}/avenantEnCours/prendreDecision:
    post:
      tags:
      - Adhesions
      summary: Prise de décision
      description: Prise de décision sur les garanties
      parameters:
      - name: adhesionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Assureur
        in: header
        required: true
        schema:
          type: string
      requestBody:
        description: Critères de prise de décisions
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriseDecisionRequete'
        required: true
      responses:
        '201':
          description: indique que la décision est créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriseDecisionReponse'
        '400':
          description: paramètre invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurClientReponse'
        '403':
          description: Accès invalide, produit non autorisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurClientReponse'
  /private/open/api/adhesions/{adhesionId}/acte:
    post:
      tags:
      - Adhesions
      summary: Création d'un acte
      description: Création d'un acte
      parameters:
      - name: adhesionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Assureur
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        description: Critères de création de l'acte
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActeRequete'
          multipart/form-data:
            schema:
              type: object
              properties:
                acte:
                  $ref: '#/components/schemas/ActeRequete'
              additionalProperties:
                type: string
                format: binary
                description: Les documents doivent être au format PDF (application/pdf) ou pour le corps
                  de la demande de renseignement au format HTML (text/html). Le nom de chaque partie (part)
                  doit correspondre à la référencespécifiée dans le courrier émis (courriersEmis.partName).
            encoding:
              acte:
                contentType: application/json
              '*':
                contentType: application/octet-stream
      responses:
        '201':
          description: indique que l'acte est créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActeReponse'
        '400':
          description: paramètre invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurClientReponse'
        '403':
          description: Accès invalide, produit non autorisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurClientReponse'
  /private/open/api/adhesions/{adhesionId}/instruireApresSignature:
    post:
      tags:
      - Adhesions
      summary: Instruction après signature
      description: Déclenche le traitement post-signature d'une adhésion
      parameters:
      - name: adhesionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Assureur
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        description: Requête d'instruction après signature, contenant le type de modification.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstruireApresSignatureRequete'
      responses:
        '200':
          description: OK
        '400':
          description: paramètre invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurClientReponse'
        '403':
          description: Accès invalide, produit non autorisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurClientReponse'
  /private/open/api/adhesions/{adhesionId}/avenants/{avenantId}/decisions:
    get:
      tags:
      - Adhesions
      summary: Consultation des décisions
      description: Restitue les décisions (décisions, surprimes, exclusions et rachat) pour un avenant
        donné.
      parameters:
      - name: adhesionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: avenantId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Assureur
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Liste des décisions du groupe de garantie pour l'avenant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DecisionGarantieReponse'
        '400':
          description: paramètre invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurClientReponse'
        '403':
          description: Accès invalide, produit non autorisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurClientReponse'
        '404':
          description: Avenant non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurClientReponse'
components:
  schemas:
    PriseDecisionRequete:
      type: object
      properties:
        decisions:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/DecisionRequete'
        produit:
          $ref: '#/components/schemas/ProduitRequete'
        assure:
          $ref: '#/components/schemas/AssureRequete'
    DecisionRequete:
      type: object
      properties:
        garantie:
          type: integer
          format: int64
        decision:
          type: string
    ProduitRequete:
      type: object
      properties:
        id:
          type: integer
          format: int64
    AssureRequete:
      type: object
      properties:
        id:
          type: integer
          format: int64
    PriseDecisionReponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        libelle:
          type: string
    ActeRequete:
      type: object
      required:
      - auteur
      - etatFinal
      - produit
      properties:
        auteur:
          type: string
        etatFinal:
          type: integer
          format: int64
        courriersAttendus:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/CourriersRequete'
        courriersRecus:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/CourriersRecuRequete'
        courriersEmis:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/CourriersEmisRequete'
        produit:
          $ref: '#/components/schemas/ProduitRequete'
    CourriersRequete:
      type: object
      properties:
        nature:
          type: integer
          format: int64
    CourriersRecuRequete:
      type: object
      description: Correspond aux documents entrants traités par l'application.
      required:
      - nature
      properties:
        nature:
          type: integer
          format: int64
        dateSignature:
          type: string
          format: date
          pattern: yyyy-MM-dd
          description: 'Obligatoire sur la nature => 1 : bulletin d''adhésion.'
        partName:
          type: string
          description: Fait référence à la part de name 'partName'. Permet d'identifier le PDF correspondant
            au courrier.
    CourriersEmisRequete:
      type: object
      description: Correspond aux documents sortants traités par l'application.
      required:
      - nature
      - typeEmission
      - destinataire
      properties:
        nature:
          type: integer
          format: int64
        typeEmission:
          type: integer
          format: int64
        destinataire:
          type: integer
          format: int64
        partName:
          type: string
          description: Fait référence à la part de name 'partName'. Permet d'identifier le document correspondant
            au courrier.
        partNameParent:
          type: string
          description: Si renseignée, la partNameParent indique que le courrier appartient au même lot
            que celui identifié par la partName correspondante. Par exemple, le corps d'un e-mail et ses
            pièces jointes seront regroupés ensemble.
    ActeReponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        site_web:
          type: string
          format: uri
        courriersRecus:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/CourrierReponse'
        courriersEmis:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/CourrierReponse'
    CourrierReponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        document:
          $ref: '#/components/schemas/DocumentReponse'
    DocumentReponse:
      type: object
      description: Représente le document GED
      properties:
        id:
          type: string
    ErreurClientReponse:
      type: object
      properties:
        survenuLe:
          type: string
          format: date-time
        correlationId:
          type: string
        codes:
          uniqueItems: true
          type: array
          items:
            type: string
        messages:
          uniqueItems: true
          type: array
          items:
            type: string
    InstruireApresSignatureRequete:
      type: object
      properties:
        demandeModifEnCours:
          type: string
          description: 'Fait référence au type de la demande de modification en cours. Valeurs possibles
            : ADMINISTRATIVE.'
    DecisionGarantieReponse:
      type: object
      properties:
        decision:
          $ref: '#/components/schemas/PriseDecisionReponse'
        garantie:
          $ref: '#/components/schemas/GarantieReponse'
        pourmillageSurprimeMedicale:
          type: number
        pourcentageSurprimeMedicale:
          type: number
        pourmillageSurprimeProfession:
          type: number
        pourcentageSurprimeProfession:
          type: number
        pourmillageSurprimeRisquesDivers:
          type: number
        pourcentageSurprimeRisquesDivers:
          type: number
        exclusionMedicale:
          type: string
        exclusionRisquesDivers:
          type: string
        rachatRisquesDivers:
          type: string
        nbMoisAjournement:
          type: integer
          format: int64
        facteursRisquesRachetes:
          type: array
          items:
            $ref: '#/components/schemas/FacteurRisqueRacheteReponse'
    GarantieReponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        libelle:
          type: string
    FacteurRisqueRacheteReponse:
      type: object
      properties:
        decision:
          $ref: '#/components/schemas/PriseDecisionReponse'
        pourmillageSurprimeRisquesDivers:
          type: number
        pourcentageSurprimeRisquesDivers:
          type: number
        exclusionRisquesDivers:
          type: string
