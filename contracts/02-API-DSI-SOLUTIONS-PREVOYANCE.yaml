openapi: 3.0.1
info:
  title: API DSI SOLUTIONS PREVOYANCE
  description: |
    Endpoints relatifs au Système d'Information Hors Emprunteur.

    Les endpoints sont accessibles en mode sécurisé ou non (secure vs open), selon les besoins et le contexte d'intégration.
      - Un partenaire accède aux API via l'application api-gateway, qui redirige les appels vers le chemin /private/secure.
      - Un appel interne passe par l'URL /private/open, en attendant la généralisation d'EntraId.

    Mode sécurisé : les API sont cloisonnées par assureurs ou distributeurs.
  contact:
    name: Support
    email: gestion-contrats@kereistechnologies.com
  license:
    name: CC-BY-NC-ND
  version: "1.0"
servers:
- url: https://fare-ng-internal-i1.cbp-dev.com/private/open
- url: https://fare-ng-internal-i1.cbp-dev.com/private/secure
- url: http://localhost:9001/private/open
- url: http://localhost:9001/private/secure
paths:
  /api/adhesions/{adhesionId}/avenants:
    post:
      tags:
      - Adhesions
      summary: Création avenant
      description: Création d'un avenant
      operationId: avenants_1
      parameters:
      - name: adhesionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        description: Critères de création
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvenantRequete'
        required: true
      responses:
        "201":
          description: L'avenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvenantReponse'
      security:
      - bearer: []
  /api/adhesions/{adhesionId}:
    get:
      tags:
      - Adhesions
      operationId: consultation
      parameters:
      - name: adhesionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: L'adhésion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdhesionReponse'
      security:
      - bearer: []
    put:
      tags:
      - Adhesions
      summary: Modification
      description: Modification d'une adhésion
      operationId: modification_1
      parameters:
      - name: adhesionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        description: Critères de modification
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdhesionRequete'
        required: true
      responses:
        "200":
          description: L'adhésion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdhesionReponse'
      security:
      - bearer: []
  /api/adhesions/{adhesionId}/avenants/{avenantId}:
    get:
      tags:
      - Adhesions
      operationId: consultationAvenant
      parameters:
      - name: adhesionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: avenantId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: L'avenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvenantReponse'
      security:
      - bearer: []
  /api/adhesions:
    post:
      tags:
      - Adhesions
      summary: Création
      description: Création d'une pré-adhésion (adhesion en attente)
      operationId: creation_1
      requestBody:
        description: Critères de création
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdhesionRequete'
        required: true
      responses:
        "201":
          description: L'adhésion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdhesionReponse'
        "400":
          description: Paramètres invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurClientReponse'
        "403":
          description: Accès invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurClientReponse'
      security:
      - bearer: []
  /api/adhesions/{adhesionId}/fermer:
    post:
      tags:
      - Adhesions
      summary: Modification
      description: Fermeture d'une adhésion
      operationId: fermer_1
      parameters:
      - name: adhesionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        description: Critères de fermeture
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FermetureRequete'
        required: true
      responses:
        "200":
          description: L'adhésion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdhesionReponse'
      security:
      - bearer: []
  /api/adhesions/{adhesionId}/avenantEnCours:
    put:
      tags:
      - Adhesions
      summary: Modification d'avenant
      description: Modification d'un avenant
      operationId: modificationAvenants_1
      parameters:
      - name: adhesionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        description: Critères de création
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvenantRequete'
        required: true
      responses:
        "200":
          description: L'avenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvenantReponse'
      security:
      - bearer: []
  /api/adhesions/recherche:
    post:
      tags:
      - Adhesions
      summary: Recherche
      description: Recherche d'adhésions via des critères spécifiques dans le corps
        de requête
      operationId: recherche_1
      requestBody:
        description: "Critères de recherche des adhésions voulues, et critères de\
          \ pagination"
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdhesionRequeteRecherche'
        required: true
      responses:
        "200":
          description: Liste d'adhésions trouvées correspondant aux critères de recherche
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RechercheReponse'
        "400":
          description: Paramètres invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurClientReponse'
        "403":
          description: Accès invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurClientReponse'
      security:
      - bearer: []
  /api/adhesions/{adhesionId}/avenantEnCours/valider:
    post:
      tags:
      - Adhesions
      summary: Démarrage de l'adhésion
      description: Valider un avenant
      operationId: valider_1
      parameters:
      - name: adhesionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        description: Critères de validation
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValiderRequete'
        required: true
      responses:
        "200":
          description: L'avenant a été validé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdhesionReponse'
        "208":
          description: L'avenant est déjà validé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdhesionReponse'
      security:
      - bearer: []
  /api/adhesions/{adhesionId}/conformite:
    get:
      tags:
      - Conformite adhesion
      summary: Consultation conformite adhesion
      operationId: consultation_1
      parameters:
      - name: adhesionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: "Indicateurs de conformite (TER, BLA, PPE, VR1, VR2, VIP, PREMIUM)\
            \ et flag archived"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConformiteAdhesionReponse'
        "400":
          description: Parametre invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurClientReponse'
        "403":
          description: Acces invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurClientReponse'
        "500":
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurServeurReponse'
      security:
      - bearer: []
  /api/personnes/{personneId}:
    get:
      tags:
      - Personnes
      operationId: consultation_2
      parameters:
      - name: personneId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: La personne
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonneReponse'
      security:
      - bearer: []
  /api/personnes:
    post:
      tags:
      - Personnes
      summary: Création
      description: Création d'une personne
      operationId: creation_2
      requestBody:
        description: Critères de création
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonneCreationRequete'
        required: true
      responses:
        "201":
          description: La personne
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonneReponse'
        "400":
          description: Paramètres invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurClientReponse'
        "403":
          description: Accès invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurClientReponse'
      security:
      - bearer: []
  /api/produits/{produitId}/clauses:
    get:
      tags:
      - Produits
      operationId: clauses
      parameters:
      - name: produitId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: les clauses bénéficiaires possibles pour le produit
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClauseReponse'
        "400":
          description: Paramètre invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurClientReponse'
        "403":
          description: "Accès invalide, produit non autorisé"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurClientReponse'
      security:
      - bearer: []
  /supervision/buildInfo:
    get:
      tags:
      - supervision
      description: Accède aux informations de build de Fare NG
      operationId: buildInfo
      responses:
        default:
          description: Accède aux informations de build de Fare NG
          content:
            application/json:
              schema:
                type: string
        "400":
          description: Bad Request
        "404":
          description: Access Denied
  /supervision/disponibilite:
    get:
      tags:
      - supervision
      description: verifier la disponibilité de l'application fare
      operationId: disponibilite
      responses:
        default:
          description: verifier la disponibilité de l'application fare
          content:
            text/plain:
              schema:
                type: string
        "400":
          description: Bad Request
        "404":
          description: Access Denied
  /supervision/healthCheck:
    get:
      tags:
      - supervision
      description: vérifier la santé de Fare NG
      operationId: healthCheck
      responses:
        default:
          description: vérifier la santé de Fare NG
          content:
            text/plain:
              schema:
                type: string
        "400":
          description: Bad Request
        "404":
          description: Access Denied
  /supervision:
    get:
      tags:
      - supervision
      description: accéder à la page de supervision
      operationId: index
      responses:
        default:
          description: accéder à la page de supervision
          content:
            text/plain:
              schema:
                type: string
        "400":
          description: Bad Request
        "404":
          description: Access Denied
components:
  schemas:
    AssureRequete:
      required:
      - choixGaranties
      type: object
      properties:
        referenceExterne:
          type: string
          description: "Référence externe, obligatoire si 'id' n'est pas renseigné"
        id:
          type: integer
          description: "Identifiant, obligatoire si 'referenceExterne' n'est pas renseigné\
            e"
          format: int64
          deprecated: true
        personneId:
          type: integer
          description: "Identifiant, obligatoire si 'referenceExterne' n'est pas renseigné\
            e. Remplace l'ancien id."
          format: int64
        dateNaissance:
          pattern: yyyy-MM-dd
          type: string
          description: "Référence externe, obligatoire si création par référence externe"
          format: date
        formuleCode:
          type: string
        choixGaranties:
          type: array
          items:
            $ref: '#/components/schemas/ChoixGarantieRequete'
        aReductionCouple:
          type: boolean
    AvenantRequete:
      required:
      - assures
      - dateEffetDesGaranties
      type: object
      properties:
        dateEffetDesGaranties:
          pattern: yyyy-MM-dd
          type: string
          format: date
        assures:
          type: array
          items:
            $ref: '#/components/schemas/AssureRequete'
    BeneficiaireRequete:
      required:
      - referenceExterne
      type: object
      properties:
        referenceExterne:
          type: string
        pourcentageDroit:
          type: integer
          description: selon règles du produit d'assurance.
          format: int64
      description: obligatoire lorsque beneficiairesClauseId pointe vers une clause
        de bénéficiaires nommés
    ChoixGarantieRequete:
      required:
      - garantieId
      type: object
      properties:
        garantieId:
          type: integer
          description: "selon les règles du produit d'assurance, valeurs possibles\
            \ indiquées par API Produit"
          format: int64
        montantAssure:
          type: number
          description: selon les règles du produit d'assurance
        prestationSinistreId:
          type: integer
          description: selon les règles du produit d'assurance
          format: int64
        beneficiairesClauseId:
          type: integer
          description: selon les règles du produit d'assurance; nul lorsqu'implicite
            avec la garantie (non décès); à expliciter généralement les choix DC &
            équiv.
          format: int64
        beneficiairesClauseLibre:
          type: string
          description: obligatoire lorsque beneficiairesClauseId pointe vers une clause
            libre
        beneficiairesNommes:
          type: array
          description: obligatoire lorsque beneficiairesClauseId pointe vers une clause
            de bénéficiaires nommés
          items:
            $ref: '#/components/schemas/BeneficiaireRequete'
    AssureReponse:
      type: object
      properties:
        formaliteSpecifique:
          type: string
        profession:
          type: string
        ordre:
          type: integer
          format: int32
        referenceExterne:
          type: string
        id:
          type: integer
          format: int64
        choixGaranties:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/ChoixGarantieReponse'
        dateNaissance:
          pattern: yyyy-MM-dd
          type: string
          format: date
        personneId:
          type: integer
          format: int64
        referentielPersonneId:
          type: integer
          format: int64
        formuleCode:
          type: string
        aReductionCouple:
          type: boolean
    AvenantReponse:
      type: object
      properties:
        dateEffetDesGaranties:
          pattern: yyyy-MM-dd
          type: string
          format: date
        dateTarifaire:
          pattern: yyyy-MM-dd
          type: string
          format: date
        etat:
          type: string
          enum:
          - EN_ETUDE
          - VALIDE
          - ABANDONNE
        codeCategorieComptable:
          type: string
        id:
          type: integer
          format: int64
        assures:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/AssureReponse'
    BeneficiaireReponse:
      type: object
      properties:
        pourcentageDroit:
          type: integer
          format: int64
        personneId:
          type: object
        referenceExterne:
          type: string
    ChoixGarantieReponse:
      type: object
      properties:
        garantieId:
          type: integer
          format: int64
        deduitMadelin:
          type: boolean
        franchise:
          $ref: '#/components/schemas/FranchiseReponse'
        beneficiairesClauseLibre:
          type: string
          description: "Si la garantie contient une clause libre, son texte sera repris\
            \ dans le champ texteClause."
          deprecated: true
        texteClause:
          type: string
          description: "Si la garantie contient une clause et qu'il n'y a pas de bé\
            néficiaires nommés, alors retourne le texte descriptif de la clause."
        dateLimiteGarantie:
          pattern: yyyy-MM-dd
          type: string
          format: date
        beneficiairesNommes:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/BeneficiaireReponse'
        echeancesMontantsAssures:
          uniqueItems: true
          type: array
          description: "L'évolution des capitaux au fil du temps (revalorisation,\
            \ dégressivité...)."
          items:
            $ref: '#/components/schemas/EcheanceMontantAssure'
        montantAssureSecondePeriode:
          type: number
          description: "Montant assuré de la deuxième période (IJ3 pour ITT, montant\
            \ de deuxième période pour objet indemnitaire)."
        montantAssureTroisiemePeriode:
          type: number
          description: "Montant assuré de la troisième période (IJ3 pour ITT, montant\
            \ de troisième période pour objet indemnitaire)."
        montantAssure:
          type: number
          description: Montant assuré à la prise d'effet de l'avenant.
        prestationSinistreId:
          type: integer
          description: |2

                    1-Capital
                    2-Rente Forfaitaire
                    3-Rente Indemnitaire
                    4-IJ Forfaitaire
                    5-IJ Indemnitaire
          format: int64
        beneficiairesClauseId:
          type: integer
          description: "Les valeurs valides pour beneficiairesClauseId sont disponibles\
            \ via l'endpoint /api/produits/XX/clauses .\n        L'identifiant ne\
            \ retourne pas le texte de la clause mais sa catégorie (standard, désigné\
            e...) "
          format: int64
    EcheanceMontantAssure:
      type: object
      properties:
        montantTtc:
          type: number
        montantIndemnitaire:
          type: number
        prestationRO:
          type: string
        dateEcheance:
          pattern: yyyy-MM-dd
          type: string
          format: date
      description: "L'évolution des capitaux au fil du temps (revalorisation, dégressivité\
        ...)."
    FranchiseReponse:
      type: object
      properties:
        libelle:
          type: string
          description: "Libellé abrégé de la franchise, ex : 15/0/3 (jours maladie\
            \ / jours accident / jours hospitalisation)"
        id:
          type: integer
          format: int64
    AdhesionReponse:
      type: object
      properties:
        numero:
          type: string
        referenceAssureur:
          type: string
        etat:
          type: string
        dateOuverture:
          pattern: yyyy-MM-dd
          type: string
          format: date
        dateSignature:
          pattern: yyyy-MM-dd
          type: string
          format: date
        dateFermeture:
          pattern: yyyy-MM-dd
          type: string
          format: date
        dateCreation:
          type: string
          format: date-time
        motifFermeture:
          $ref: '#/components/schemas/MotifFermetureReponse'
        produit:
          $ref: '#/components/schemas/ProduitReponse'
        distributeur:
          $ref: '#/components/schemas/DistributeurReponse'
        entite:
          $ref: '#/components/schemas/EntiteReponse'
        conseiller:
          $ref: '#/components/schemas/ConseillerReponse'
        jourReconduction:
          type: integer
          format: int32
        moisReconduction:
          type: integer
          format: int32
        avenantEnCours:
          $ref: '#/components/schemas/AvenantUltraCondenseReponse'
        avenantValideEtEnCours:
          $ref: '#/components/schemas/AvenantUltraCondenseReponse'
        id:
          type: integer
          format: int64
        souscription:
          $ref: '#/components/schemas/SouscriptionReponse'
        avenants:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/AvenantUltraCondenseReponse'
        specifiqueAssureur:
          type: object
          additionalProperties:
            type: object
        motifFermetureId:
          type: integer
          description: va prochainement disparaitre au profit de l'objet motifFermeture
          format: int64
          deprecated: true
      description: |2

        Le contrat incluant des facilitateurs :
         - avenantEnCours : l'avenant à l'instant T, quel que soit son état
         - avenantValideEtEnCours : l'avenant valide à l'instant T
    AvenantUltraCondenseReponse:
      type: object
      properties:
        dateEffetDesGaranties:
          pattern: yyyy-MM-dd
          type: string
          format: date
        etat:
          type: string
          enum:
          - EN_ETUDE
          - VALIDE
          - ABANDONNE
        id:
          type: integer
          format: int64
    ConseillerReponse:
      type: object
      properties:
        numero:
          type: string
        email:
          type: string
        designation:
          type: string
    DistributeurReponse:
      type: object
      properties:
        libelle:
          type: string
        id:
          type: integer
          format: int64
        codeExterne:
          type: string
    EntiteReponse:
      type: object
      properties:
        codeExterne:
          type: string
        libelle:
          type: string
        id:
          type: integer
          format: int64
    HistoPeriodiciteReponse:
      type: object
      properties:
        dateEffet:
          pattern: yyyy-MM-dd
          type: string
          format: date
        id:
          type: integer
          format: int64
    MotifFermetureReponse:
      type: object
      properties:
        libelle:
          type: string
        id:
          type: integer
          format: int64
      description: "1-ABANDON, 2-RESILIATION_MED, 3-RESILIATION_ASSURE, 4-RENONCIATION_ASSURE,\
        \ 5-DECES, 6-REFUS_NON_TITULAIRE_BAIL, 7-REFUS_PROFESSION_NON_ELIGIBLE, 8-ANNULATION,\
        \ 9-AGE_LIMITE_DEPASSE, 10-REFUS, 11-APRES_SINISTRE, 12-FAUSSE_DECLARATION,\
        \ 13-DENONCIATION_ASSUREUR, 14-RACHAT, 15-INVALIDITE_PRET, 16-TERME_ATTEINT"
    PeriodiciteReponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        dateEffet:
          pattern: yyyy-MM-dd
          type: string
          format: date
        dateModificationPeriodicite:
          pattern: yyyy-MM-dd
          type: string
          format: date
        historique:
          type: array
          items:
            $ref: '#/components/schemas/HistoPeriodiciteReponse'
    PersonneUltraCondenseReponse:
      type: object
      properties:
        personneId:
          type: integer
          format: int64
        referentielPersonneId:
          type: integer
          description: "Identifiant unique de la personne dans le référentiel-personne,\
            \ utilisé pour récupérer les résultats du contrôle Lablat."
          format: int64
        referenceExterne:
          type: string
    ProduitReponse:
      type: object
      properties:
        libelle:
          type: string
        assureurCode:
          type: integer
          format: int64
        id:
          type: integer
          format: int64
        activiteComptable:
          type: integer
